name: Build H5 Images

# =============================================================================
# 只负责「前端 H5」的两个镜像，不构建后端（后端镜像在 release.yml 中构建，
# 避免同一 commit 被多个工作流重复构建）。
#
# 统一到单一镜像仓库（默认 <owner>/zaima），用标签前缀区分用途，便于集中管理：
#   1) zaima:h5-assets-* ：scratch 空根镜像，只含 H5 构建产物，体积极小，便于分发/提取；
#   2) zaima:h5-*        ：nginx:alpine + H5 产物，可直接 docker run 起来做测试。
#   （标签命名：h5-latest / h5-<tag> / h5-sha-<sha>，静态镜像同理加 assets）
#
# 复用策略（核心）：H5 只在 build-h5 作业构建 **一次**，上传为 artifact；
#   两个镜像作业下载同一份产物到 h5-dist/ 后再构建，**不在 Docker 内重复 npm build**。
#
# 触发：push 到 main（或手动触发）。打 tag 时不跑，避免与 release.yml 重复构建 H5。
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'Dockerfile'
      - 'Dockerfile.nginx'
      - '.dockerignore'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 同一分支只保留最新一次构建，避免并发互相覆盖
concurrency:
  group: h5-images-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  REGISTRY: docker.io
  # 统一镜像仓库：默认 <owner>/zaima（与 release.yml 一致），用标签前缀区分用途
  IMAGE_REPO: ${{ vars.DOCKER_REPOSITORY || format('{0}/zaima', github.repository_owner) }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) 构建 H5（整个工作流里唯一一次构建）
  # ---------------------------------------------------------------------------
  build-h5:
    name: 构建 H5 产物
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 拉取源码
      - name: 检出代码
        uses: actions/checkout@v4

      # 安装 Node 22，并启用 npm 缓存（按 lockfile 命中）
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 严格按 lockfile 安装依赖（可复现）
      - name: 安装依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # 计算版本号与构建号（构建号 = 提交短哈希），注入前端产物
      - name: 计算版本与构建号
        id: ver
        working-directory: frontend
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 构建 H5 静态站点，产物在 frontend/dist/build/h5
      - name: 构建 H5
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ steps.ver.outputs.version }}
          VITE_APP_BUILD: ${{ steps.ver.outputs.build }}
        run: npm run build:h5

      # 上传产物，供后续镜像作业复用（避免二次构建）
      - name: 上传 H5 产物
        uses: actions/upload-artifact@v4
        with:
          name: h5-dist
          path: frontend/dist/build/h5
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 2) 静态产物镜像（scratch 空根，仅含产物，用于分发）
  # ---------------------------------------------------------------------------
  assets-image:
    name: 构建静态产物镜像（scratch）
    needs: build-h5
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 只需要仓库里的 Dockerfile，无需源码
      - name: 检出代码
        uses: actions/checkout@v4

      # 取回上一步的 H5 产物，落地到 h5-dist/（Dockerfile 直接 COPY 该目录）
      - name: 下载 H5 产物到 h5-dist/
        uses: actions/download-artifact@v4
        with:
          name: h5-dist
          path: h5-dist

      # 校验产物确实存在：缺失时给出清晰报错，而不是 Docker 的 cache key 报错
      - name: 校验 H5 产物存在
        run: test -f h5-dist/index.html || { echo "::error::h5-dist/index.html 缺失"; ls -la h5-dist || true; exit 1; }

      # 启用 Buildx（支持多平台/缓存等）
      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 Docker Hub（复用与 release.yml 相同的 Secrets）
      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 计算短提交号（用于 sha 标签）
      - name: 计算短提交号
        id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 生成镜像标签：zaima:h5-assets-latest / h5-assets-<tag> / h5-assets-sha-<sha>
      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=raw,value=h5-assets-latest,enable={{is_default_branch}}
            type=raw,value=h5-assets-${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=h5-assets-sha-${{ steps.vars.outputs.short }}

      # 构建并推送 scratch 镜像，标签同上
      - name: 构建并推送（scratch，仅产物）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

  # ---------------------------------------------------------------------------
  # 3) 可运行测试镜像（nginx:alpine + 产物）
  # ---------------------------------------------------------------------------
  nginx-image:
    name: 构建可运行测试镜像（nginx）
    needs: build-h5
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 检出代码（需要 Dockerfile.nginx）
      - name: 检出代码
        uses: actions/checkout@v4

      # 复用同一份 H5 产物
      - name: 下载 H5 产物到 h5-dist/
        uses: actions/download-artifact@v4
        with:
          name: h5-dist
          path: h5-dist

      # 校验产物确实存在：缺失时给出清晰报错
      - name: 校验 H5 产物存在
        run: test -f h5-dist/index.html || { echo "::error::h5-dist/index.html 缺失"; ls -la h5-dist || true; exit 1; }

      # 启用 Buildx
      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 Docker Hub
      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 计算短提交号（用于 sha 标签）
      - name: 计算短提交号
        id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 生成标签：zaima:h5-latest / h5-<tag> / h5-sha-<sha>
      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=raw,value=h5-latest,enable={{is_default_branch}}
            type=raw,value=h5-${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=h5-sha-${{ steps.vars.outputs.short }}

      # 构建并推送 nginx 镜像
      - name: 构建并推送（nginx:alpine）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.nginx
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      # 冒烟：真正把镜像跑起来，确认首页返回 H5 入口
      - name: 冒烟：启动容器并访问首页
        run: |
          set -euo pipefail
          REF=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name h5-smoke -p 18080:80 "${REF}"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ -o /tmp/index.html 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "${ok}" = "1" || { echo "::error::nginx 镜像启动失败"; docker logs h5-smoke; exit 1; }
          grep -qi '<div id="app"' /tmp/index.html || { echo "::error::首页未返回 H5 入口"; cat /tmp/index.html; exit 1; }
          echo "nginx 镜像冒烟通过"
          docker rm -f h5-smoke

      # 汇总镜像信息，方便在 Actions 页面直接查看
      - name: 写入构建摘要
        run: |
          {
            echo "### H5 可运行镜像（nginx）"
            echo ""
            echo "| 镜像 | 标签 |"
            echo "| --- | --- |"
            echo "| ${{ env.IMAGE_REPO }} | \`$(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' ')\` |"
            echo ""
            echo "本地验证：\`docker run --rm -p 8080:80 ${{ env.IMAGE_REPO }}:h5-latest\` 后访问 http://localhost:8080/"
          } >> "$GITHUB_STEP_SUMMARY"
