name: Build and Push H5 Image

# 把 H5 静态产物构建成镜像并推送到 Docker 仓库 (默认 GHCR，GitHub 自带、零额外账号)。
# 镜像名：ghcr.io/<owner>/zaima-h5
#
# 触发：push 到 main（打 latest 标签）或打 v* tag（打版本标签），也可手动触发。
# 想改用 Docker Hub？见下方注释。
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/build-image.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        # 改用 Docker Hub 时，替换为：
        #   registry: docker.io
        #   username: ${{ secrets.DOCKERHUB_USERNAME }}
        #   password: ${{ secrets.DOCKERHUB_TOKEN }}
        # 并把下面 images 改成 docker.io/<你的用户名>/zaima-h5

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zaima-h5
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
