# =============================================================================
# ci-cd.yml  -- 通用公共 CI/CD 模板（任意工程 drop-in 即用）
#
# 配置来源：以仓库内 .ci/project.config.yaml 为准；GitHub Variables 仅作缺省回退。
# 作业 DAG（一次构建、多处复用）：
#   setup ─┬─ ci                测试/检查
#          ├─ build-static      编译 HTML 一次 → artifact(dist)
#          │      ├─ docker-app-nginx  dist → nginx:alpine（复用产物，秒级）
#          │      ├─ docker-assets     dist → scratch 镜像（不重编）
#          │      └─ cloudflare        dist → 部署 Pages（不重编）
#          ├─ docker-app        应用镜像（用户 Dockerfile，默认单架构）
#          └─ release           v* tag 自动发版
#
# 应用镜像策略 docker.app_strategy：
#   auto           纯前端且无 Dockerfile → nginx-prebuilt；有 Dockerfile → dockerfile
#   dockerfile     使用（自动搜索到的）用户 Dockerfile
#   nginx-prebuilt 复用 build-static 的 dist，nginx:alpine 秒级出镜像
#   none           不构建应用镜像
#
# 自动识别：pyproject/requirements → 后端；package.json（根或子目录）→ 前端；都有 → 全栈。
# 预留自定义步骤：仓库 .ci/hooks/ 下放同名脚本即被调用（见 .ci/hooks/README.md）。
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.14' }}

jobs:
  # ===========================================================================
  # 1) 探测：前端目录/锁文件/包管理器/build 脚本 + 读取项目配置 + 计算开关
  # ===========================================================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      is_backend: ${{ steps.detect.outputs.is_backend }}
      is_frontend: ${{ steps.detect.outputs.is_frontend }}
      type: ${{ steps.detect.outputs.type }}
      docker_app: ${{ steps.detect.outputs.docker_app }}
      docker_assets: ${{ steps.detect.outputs.docker_assets }}
      frontend_dir: ${{ steps.fe.outputs.frontend_dir }}
      frontend_lock: ${{ steps.fe.outputs.frontend_lock }}
      frontend_pm: ${{ steps.fe.outputs.frontend_pm }}
      frontend_has_build: ${{ steps.fe.outputs.frontend_has_build }}
      frontend_build_cmd: ${{ steps.fe.outputs.frontend_build_cmd }}
      backend_dir: ${{ steps.fe.outputs.backend_dir }}
      registry: ${{ steps.cfg.outputs.registry }}
      docker_image: ${{ steps.cfg.outputs.docker_image }}
      dockerfile_path: ${{ steps.cfg.outputs.dockerfile_path }}
      docker_context: ${{ steps.cfg.outputs.docker_context }}
      docker_platforms: ${{ steps.cfg.outputs.docker_platforms }}
      app_strategy: ${{ steps.cfg.outputs.app_strategy }}
      assets_dockerfile: ${{ steps.cfg.outputs.assets_dockerfile }}
      static_build_cmd: ${{ steps.cfg.outputs.static_build_cmd }}
      static_dist_dir: ${{ steps.cfg.outputs.static_dist_dir }}
      cloudflare_project: ${{ steps.cfg.outputs.cloudflare_project }}
      enable_static_cloudflare: ${{ steps.cfg.outputs.enable_static_cloudflare }}
    steps:
      - uses: actions/checkout@v4

      # 自动定位前端目录（可能在 frontend/ web/ client/），并找锁文件、包管理器、build 脚本
      - name: Detect frontend dir
        id: fe
        run: |
          if [ -f .ci/scripts/detect-frontend.sh ]; then
            bash .ci/scripts/detect-frontend.sh >> "$GITHUB_OUTPUT"
          else   # 容错：未安装 .ci/ 时退回根目录判断
            {
              echo "frontend_dir=."; echo "frontend_lock="; echo "frontend_pm=npm"
              echo "frontend_has_build=false"; echo "frontend_build_cmd="
              echo "has_frontend=$([ -f package.json ] && echo true || echo false)"
              echo "backend_dir=."
              echo "has_backend=$([ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ] && echo true || echo false)"
            } >> "$GITHUB_OUTPUT"
          fi

      # 读取 .ci/project.config.yaml（配置以此为准；Variables 仅回退）
      - name: Load project config
        id: cfg
        run: |
          CFG=""
          if [ -f .ci/project.config.yaml ] && [ -f .ci/scripts/read-config.sh ]; then
            CFG="$(bash .ci/scripts/read-config.sh .ci/project.config.yaml 2>/dev/null || true)"
          fi
          get() { printf '%s\n' "$CFG" | grep -E "^$1=" | head -1 | cut -d= -f2- || true; }
          pick() { local c="$1" v="$2" d="$3"; if [ -n "$c" ] && [ "$c" != "auto" ]; then echo "$c"; elif [ -n "$v" ]; then echo "$v"; else echo "$d"; fi; }

          REGISTRY="$(pick "$(get docker.registry)" "${{ vars.REGISTRY }}" "registry.cn-hangzhou.aliyuncs.com")"
          IMAGE="$(pick "$(get docker.image)" "${{ vars.DOCKER_IMAGE }}" "")"

          # Dockerfile：配置优先；否则自动搜索（detect 脚本输出的最浅一个）
          DOCKERFILE="$(pick "$(get docker.dockerfile)" "${{ vars.DOCKERFILE_PATH }}" "")"
          if [ -z "$DOCKERFILE" ]; then DOCKERFILE="${{ steps.fe.outputs.dockerfile_found }}"; fi

          # 构建上下文：配置优先；否则 Dockerfile 所在目录
          CONTEXT="$(pick "$(get docker.context)" "" "")"
          if [ -z "$CONTEXT" ]; then
            if [ -n "$DOCKERFILE" ]; then CONTEXT="$(dirname "$DOCKERFILE")"; else CONTEXT="."; fi
          fi

          # 默认单架构（arm64 走 QEMU 极慢，需多架构时显式配置）
          PLATFORMS="$(pick "$(get docker.platforms)" "" "linux/amd64")"

          # 构建策略：auto = 纯前端且无 Dockerfile 时用 nginx-prebuilt（复用 dist，秒级）
          APPSTRAT="$(get docker.app_strategy)"
          if [ -z "$APPSTRAT" ]; then APPSTRAT=auto; fi
          if [ "$APPSTRAT" = "auto" ]; then
            if [ "${{ steps.fe.outputs.has_frontend }}" = "true" ] && [ "${{ steps.fe.outputs.has_backend }}" != "true" ] && [ -z "$DOCKERFILE" ]; then
              APPSTRAT=nginx-prebuilt
            elif [ -n "$DOCKERFILE" ]; then
              APPSTRAT=dockerfile
            else
              APPSTRAT=none
            fi
          fi

          ASSETS="$(pick "$(get static.assets_image.dockerfile)" "${{ vars.ASSETS_DOCKERFILE }}" ".ci/docker-assets/Dockerfile.assets")"
          BUILDCMD="$(pick "$(get static.build_command)" "${{ vars.STATIC_BUILD_CMD }}" "npm run build")"
          DIST="$(pick "$(get static.output_dir)" "${{ vars.STATIC_DIST_DIR }}" "dist")"
          CFPROJ="$(pick "$(get cloudflare.project)" "${{ vars.CLOUDFLARE_PROJECT }}" "")"

          EAPP="$(get enable.docker_app)"
          if [ -z "$EAPP" ]; then EAPP="${{ vars.ENABLE_DOCKER_APP }}"; fi
          if [ -z "$EAPP" ]; then EAPP=auto; fi

          EASSETS="$(get enable.docker_assets)"
          if [ -z "$EASSETS" ]; then EASSETS="${{ vars.ENABLE_DOCKER_ASSETS }}"; fi
          if [ -z "$EASSETS" ]; then EASSETS=auto; fi

          ECF="$(get enable.static_cloudflare)"
          if [ -z "$ECF" ]; then ECF="${{ vars.ENABLE_STATIC_CLOUDFLARE }}"; fi
          if [ -z "$ECF" ]; then ECF=false; fi

          { echo "registry=$REGISTRY"; echo "docker_image=$IMAGE"; echo "dockerfile_path=$DOCKERFILE";
            echo "docker_context=$CONTEXT"; echo "docker_platforms=$PLATFORMS"; echo "app_strategy=$APPSTRAT";
            echo "assets_dockerfile=$ASSETS"; echo "static_build_cmd=$BUILDCMD"; echo "static_dist_dir=$DIST";
            echo "cloudflare_project=$CFPROJ"; echo "enable_docker_app=$EAPP"; echo "enable_docker_assets=$EASSETS";
            echo "enable_static_cloudflare=$ECF"; } >> "$GITHUB_OUTPUT"
          echo "config: registry=$REGISTRY image=$IMAGE dockerfile=$DOCKERFILE context=$CONTEXT strategy=$APPSTRAT platforms=$PLATFORMS"

      # 汇总项目类型与构建开关（显式配置优先，否则自动探测）
      - id: detect
        run: |
          is_backend="${{ steps.fe.outputs.has_backend }}"
          is_frontend="${{ steps.fe.outputs.has_frontend }}"
          if $is_backend && [ "$is_frontend" = "true" ]; then type=fullstack
          elif $is_backend; then type=backend
          elif [ "$is_frontend" = "true" ]; then type=frontend
          else type=unknown; fi

          # 应用镜像：策略为 none 或显式关闭则不构建
          strat="${{ steps.cfg.outputs.app_strategy }}"
          da="${{ steps.cfg.outputs.enable_docker_app }}"
          if [ "$da" = "false" ] || [ "$strat" = "none" ]; then docker_app=false; else docker_app=true; fi

          # 静态资源镜像：nginx-prebuilt 应用已包含静态资源，默认不再重复打 -assets
          dast="${{ steps.cfg.outputs.enable_docker_assets }}"
          if [ "$dast" = "true" ]; then docker_assets=true
          elif [ "$dast" = "false" ]; then docker_assets=false
          elif [ "$is_frontend" = "true" ] && [ "$strat" != "nginx-prebuilt" ]; then docker_assets=true
          else docker_assets=false; fi

          { echo "is_backend=$is_backend"; echo "is_frontend=$is_frontend"; echo "type=$type";
            echo "docker_app=$docker_app"; echo "docker_assets=$docker_assets"; } >> "$GITHUB_OUTPUT"
          echo "project: type=$type backend=$is_backend frontend=$is_frontend dir=${{ steps.fe.outputs.frontend_dir }}"

  # ===========================================================================
  # 2) CI：后端/前端分别 lint+test（无对应语言自动跳过；PR 与 push 都跑）
  # ===========================================================================
  ci:
    needs: setup
    if: ${{ needs.setup.outputs.type != 'unknown' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    env:
      FE_DIR: ${{ needs.setup.outputs.frontend_dir }}
      FE_PM: ${{ needs.setup.outputs.frontend_pm }}
      FE_LOCK: ${{ needs.setup.outputs.frontend_lock }}
      FE_BUILD_CMD: ${{ needs.setup.outputs.frontend_build_cmd }}
      BE_DIR: ${{ needs.setup.outputs.backend_dir }}
      HAS_FE: ${{ needs.setup.outputs.is_frontend }}
      HAS_BE: ${{ needs.setup.outputs.is_backend }}
    steps:
      - uses: actions/checkout@v4

      # 前端需先 setup-node（缓存 + 版本），具体命令交由 .ci/ci.sh
      - name: Frontend — setup node
        if: ${{ needs.setup.outputs.is_frontend == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ needs.setup.outputs.frontend_lock != '' && needs.setup.outputs.frontend_pm || '' }}
          cache-dependency-path: ${{ needs.setup.outputs.frontend_lock }}

      # 统一入口：项目可在 ci.* 或 .ci/stages/*.sh 或 Makefile 中自定义
      - name: Install
        run: bash .ci/ci.sh install
      - name: Lint
        run: bash .ci/ci.sh lint
      - name: Type check
        run: bash .ci/ci.sh typecheck
      - name: Test
        run: bash .ci/ci.sh test

      - name: Custom hook — .ci/hooks/ci.sh
        if: ${{ hashFiles('.ci/hooks/ci.sh') != '' }}
        run: bash .ci/hooks/ci.sh
        env:
          PROJECT_TYPE: ${{ needs.setup.outputs.type }}
          IS_BACKEND: ${{ needs.setup.outputs.is_backend }}
          IS_FRONTEND: ${{ needs.setup.outputs.is_frontend }}

  # ===========================================================================
  # 3) 前端编译：HTML 只编译一次，上传 artifact 供下游复用
  # ===========================================================================
  build-static:
    needs: setup
    if: >-
      ${{ github.event_name != 'pull_request' &&
          needs.setup.outputs.is_frontend == 'true' &&
          (needs.setup.outputs.docker_assets == 'true' ||
           needs.setup.outputs.enable_static_cloudflare == 'true' ||
           needs.setup.outputs.app_strategy == 'nginx-prebuilt') }}
    runs-on: ubuntu-latest
    env:
      FE_DIR: ${{ needs.setup.outputs.frontend_dir }}
      FE_PM: ${{ needs.setup.outputs.frontend_pm }}
      FE_LOCK: ${{ needs.setup.outputs.frontend_lock }}
      FE_BUILD_CMD: ${{ needs.setup.outputs.frontend_build_cmd }}
      BE_DIR: ${{ needs.setup.outputs.backend_dir }}
      HAS_FE: "true"
      HAS_BE: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Custom hook — pre-build.sh
        if: ${{ hashFiles('.ci/hooks/pre-build.sh') != '' }}
        run: bash .ci/hooks/pre-build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ needs.setup.outputs.frontend_lock != '' && needs.setup.outputs.frontend_pm || '' }}
          cache-dependency-path: ${{ needs.setup.outputs.frontend_lock }}

      # 统一入口：安装 + 构建（项目可在 ci.* / .ci/stages / Makefile 自定义）
      - name: Install dependencies
        run: bash .ci/ci.sh install
      - name: Build
        run: bash .ci/ci.sh build

      # SPA 回退
      - name: SPA fallback (404.html)
        run: |
          DIST="${{ needs.setup.outputs.frontend_dir }}/${{ needs.setup.outputs.static_dist_dir }}"
          cp "$DIST/index.html" "$DIST/404.html" 2>/dev/null || true

      # 产物统一到仓库根 dist/（Dockerfile.assets 固定 COPY dist/，Cloudflare 也部署 dist）
      - name: Normalize dist to repo root
        run: |
          SRC="${{ needs.setup.outputs.frontend_dir }}/${{ needs.setup.outputs.static_dist_dir }}"
          if [ "$SRC" != "dist" ] && [ "$SRC" != "./dist" ]; then rm -rf dist; cp -r "$SRC" dist; fi

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-dist
          path: dist
          retention-days: 1

  # ===========================================================================
  # 4) 应用镜像：构建 + 推送（版本号 + sha + latest）；镜像仓库取配置 registry
  # ===========================================================================
  docker-app:
    needs: setup
    if: >-
      ${{ github.event_name != 'pull_request' &&
          needs.setup.outputs.app_strategy == 'dockerfile' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 防止异常构建无限占用
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Custom hook — pre-build.sh
        if: ${{ hashFiles('.ci/hooks/pre-build.sh') != '' }}
        run: bash .ci/hooks/pre-build.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          # 直接使用 .ci/project.config.yaml 的 docker.registry（如 docker.io）
          registry: ${{ needs.setup.outputs.registry }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate build metadata
        id: build
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"
          elif [ -f VERSION ]; then VERSION="$(tr -d '[:space:]' < VERSION)"
          else VERSION="0.0.0"; fi
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GIT_SHA_SHORT="${GITHUB_SHA::7}"
          FULL_VERSION="${VERSION}-b${BUILD_NUMBER}"
          { echo "version=$VERSION"; echo "build_number=$BUILD_NUMBER"; echo "build_date=$BUILD_DATE";
            echo "git_sha=$GIT_SHA_SHORT"; echo "full_version=$FULL_VERSION"; } >> "$GITHUB_OUTPUT"
          cat > build-info.json <<JSON
          {"version":"$VERSION","build_number":$BUILD_NUMBER,"full_version":"$FULL_VERSION","git_sha":"$GIT_SHA_SHORT","git_ref":"${GITHUB_REF}","build_date":"$BUILD_DATE","repository":"${GITHUB_REPOSITORY}","run_id":"${GITHUB_RUN_ID}"}
          JSON

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ format('{0}/{1}', needs.setup.outputs.registry, needs.setup.outputs.docker_image) }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.build.outputs.full_version }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.version=${{ steps.build.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build.outputs.build_date }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            build.number=${{ steps.build.outputs.build_number }}
            build.date=${{ steps.build.outputs.build_date }}
            build.full_version=${{ steps.build.outputs.full_version }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ needs.setup.outputs.docker_context }}
          file: ${{ needs.setup.outputs.dockerfile_path }}
          platforms: ${{ needs.setup.outputs.docker_platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.build.outputs.full_version }}
            BUILD_NUMBER=${{ steps.build.outputs.build_number }}
            BUILD_DATE=${{ steps.build.outputs.build_date }}
            GIT_SHA=${{ steps.build.outputs.git_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Custom hook — post-build.sh
        if: ${{ hashFiles('.ci/hooks/post-build.sh') != '' }}
        run: bash .ci/hooks/post-build.sh
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}

  # ===========================================================================
  # 4b) 应用镜像（nginx-prebuilt）：下载 dist → nginx:alpine，秒级出镜像，不重编前端
  # ===========================================================================
  docker-app-nginx:
    needs: [setup, build-static]
    if: >-
      ${{ github.event_name != 'pull_request' &&
          needs.setup.outputs.app_strategy == 'nginx-prebuilt' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 复用 build-static 的产物，跳过 npm ci / npm build
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: static-dist
          path: dist

      - name: Custom hook — pre-build.sh
        if: ${{ hashFiles('.ci/hooks/pre-build.sh') != '' }}
        run: bash .ci/hooks/pre-build.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.setup.outputs.registry }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate build metadata
        id: build
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"
          elif [ -f VERSION ]; then VERSION="$(tr -d '[:space:]' < VERSION)"
          else VERSION="0.0.0"; fi
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GIT_SHA_SHORT="${GITHUB_SHA::7}"
          FULL_VERSION="${VERSION}-b${BUILD_NUMBER}"
          { echo "version=$VERSION"; echo "build_number=$BUILD_NUMBER"; echo "build_date=$BUILD_DATE";
            echo "git_sha=$GIT_SHA_SHORT"; echo "full_version=$FULL_VERSION"; } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ format('{0}/{1}', needs.setup.outputs.registry, needs.setup.outputs.docker_image) }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.build.outputs.full_version }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.version=${{ steps.build.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build.outputs.build_date }}
            build.number=${{ steps.build.outputs.build_number }}
            build.date=${{ steps.build.outputs.build_date }}
            build.full_version=${{ steps.build.outputs.full_version }}

      - uses: docker/build-push-action@v6
        with:
          context: .                              # dist 在仓库根
          file: .ci/docker-app/Dockerfile.nginx   # 极简 nginx，COPY dist
          platforms: ${{ needs.setup.outputs.docker_platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Custom hook — post-build.sh
        if: ${{ hashFiles('.ci/hooks/post-build.sh') != '' }}
        run: bash .ci/hooks/post-build.sh
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}

  # ===========================================================================
  # 5) 静态资源镜像：下载 build-static 的 dist → scratch 镜像（不重编前端）
  # ===========================================================================
  docker-assets:
    needs: [setup, build-static]
    if: >-
      ${{ github.event_name != 'pull_request' &&
          needs.setup.outputs.docker_assets == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: static-dist
          path: dist

      - name: Custom hook — pre-build.sh
        if: ${{ hashFiles('.ci/hooks/pre-build.sh') != '' }}
        run: bash .ci/hooks/pre-build.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.setup.outputs.registry }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate build metadata
        id: build
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"
          elif [ -f VERSION ]; then VERSION="$(tr -d '[:space:]' < VERSION)"
          else VERSION="0.0.0"; fi
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GIT_SHA_SHORT="${GITHUB_SHA::7}"
          FULL_VERSION="${VERSION}-b${BUILD_NUMBER}"
          { echo "version=$VERSION"; echo "build_number=$BUILD_NUMBER"; echo "build_date=$BUILD_DATE";
            echo "git_sha=$GIT_SHA_SHORT"; echo "full_version=$FULL_VERSION"; } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ format('{0}/{1}', needs.setup.outputs.registry, needs.setup.outputs.docker_image) }}
          flavor:
            suffix=-assets,onlatest=true
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.build.outputs.full_version }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.version=${{ steps.build.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build.outputs.build_date }}
            build.number=${{ steps.build.outputs.build_number }}
            build.date=${{ steps.build.outputs.build_date }}
            build.full_version=${{ steps.build.outputs.full_version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ needs.setup.outputs.assets_dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.build.outputs.full_version }}
            BUILD_NUMBER=${{ steps.build.outputs.build_number }}
            BUILD_DATE=${{ steps.build.outputs.build_date }}
            GIT_SHA=${{ steps.build.outputs.git_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Custom hook — post-build.sh
        if: ${{ hashFiles('.ci/hooks/post-build.sh') != '' }}
        run: bash .ci/hooks/post-build.sh
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}

  # ===========================================================================
  # 6) Cloudflare Pages：下载 dist artifact 直接部署（不重编前端）
  # ===========================================================================
  cloudflare:
    needs: [setup, build-static]
    if: >-
      ${{ github.event_name != 'pull_request' &&
          needs.setup.outputs.enable_static_cloudflare == 'true' &&
          needs.setup.outputs.is_frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: static-dist
          path: dist

      - name: Custom hook — pre-deploy.sh
        if: ${{ hashFiles('.ci/hooks/pre-deploy.sh') != '' }}
        run: bash .ci/hooks/pre-deploy.sh
        env:
          CLOUDFLARE_PROJECT: ${{ needs.setup.outputs.cloudflare_project }}
          STATIC_DIST_DIR: dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/build/h5 --project-name=${{ needs.setup.outputs.cloudflare_project }} --branch main

      - name: Custom hook — post-deploy.sh
        if: ${{ hashFiles('.ci/hooks/post-deploy.sh') != '' }}
        run: bash .ci/hooks/post-deploy.sh
        env:
          CLOUDFLARE_PROJECT: ${{ needs.setup.outputs.cloudflare_project }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}

  # ===========================================================================
  # 7) 发布：推送 v* tag 自动生成 GitHub Release
  # ===========================================================================
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then LOG=$(git log ${PREV}..HEAD --pretty=format:'- %s (%an)')
          else LOG=$(git log --pretty=format:'- %s (%an)'); fi
          { echo "log<<EOF"; echo "$LOG"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 变更摘要
            ${{ steps.changelog.outputs.log }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
