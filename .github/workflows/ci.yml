name: CI

# 触发：Pull Request 与手动触发。
# 本工作流只做检查，**不会**登录 Docker Hub，也不会推送任何镜像。
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# 最小权限：只读仓库内容，不使用任何 secrets。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'

jobs:
  backend-tests:
    name: 后端测试 / ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zaima
          POSTGRES_PASSWORD: zaima
          POSTGRES_DB: zaima_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zaima -d zaima_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # sqlite 矩阵留空，conftest 会自动退化为本地 SQLite
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://zaima:zaima@localhost:5432/zaima_test' || '' }}
      DATABASE_URL: postgresql+psycopg://zaima:zaima@localhost:5432/zaima_test
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Alembic 迁移往返（postgres）
        if: matrix.database == 'postgres'
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

      - name: 运行测试
        working-directory: backend
        run: pytest -q --junitxml=pytest-${{ matrix.database }}.xml

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-report-${{ matrix.database }}-${{ github.run_attempt }}
          path: backend/pytest-${{ matrix.database }}.xml
          if-no-files-found: warn
          retention-days: 7

  frontend-checks:
    name: 前端检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（严格按锁文件）
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund

      - name: TypeScript 类型检查
        run: npm run type-check

      # 项目当前未配置 ESLint / 单元测试，这里做能力探测：
      # 一旦 package.json 增加 lint / test 脚本，CI 会自动执行，不会静默跳过。
      - name: ESLint（未配置则跳过）
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "::notice title=Lint 未配置::package.json 中没有 lint 脚本，本步骤跳过"
          fi

      - name: 前端测试（未配置则跳过）
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm run test
          else
            echo "::notice title=前端测试未配置::package.json 中没有 test 脚本，本步骤跳过"
          fi

      - name: H5 构建（验证可编译）
        run: npm run build:h5

      - name: 校验构建产物
        run: |
          set -euo pipefail
          test -f dist/build/h5/index.html
          echo "H5 产物文件数: $(find dist/build/h5 -type f | wc -l)"

  docker-build:
    name: Dockerfile 构建与启动冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # PR 只验证「能不能构建」，push 恒为 false，不登录、不推送。
      - name: 构建镜像（不推送）
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: zaima-api:ci
          build-args: |
            APP_VERSION=ci
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=zaima-api
          cache-to: type=gha,scope=zaima-api,mode=max
          # load:true 需要关闭 attestation，否则 docker exporter 报 manifest list 错误
          provenance: false
          sbom: false

      - name: 校验以非 root 运行
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id zaima-api:ci -u)
          echo "容器内 uid: $uid"
          test "$uid" != "0"

      # 纯 API 镜像不允许包含任何前端文件（H5 只属于 Dockerfile.app 的调试镜像）
      - name: 校验 API 镜像不含前端
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh zaima-api:ci -c '
            test ! -d /app/static || { echo "::error::API 镜像不应包含 /app/static"; exit 1; }
            n=$(find / -name "index.html" -not -path "*/site-packages/*" 2>/dev/null | wc -l)
            test "$n" -eq 0 || { echo "::error::API 镜像内发现 index.html"; exit 1; }
          '
          echo "API 镜像不含前端文件"

      - name: 容器启动冒烟（SQLite）
        run: |
          set -euo pipefail
          docker run -d --name zaima-smoke -p 18000:8000 \
            -e APP_ENV=dev \
            -e AUTO_CREATE_TABLES=true \
            -e SCHEDULER_ENABLED=false \
            -e DATABASE_URL=sqlite+pysqlite:////tmp/zaima.db \
            -e EMAIL_ADAPTER=mock \
            zaima-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            sleep 1
          done
          test -s /tmp/health.json
          # 根路径必须是 JSON（说明没有托管前端）
          curl -fsS http://127.0.0.1:18000/ -o /tmp/root.json
          grep -q '"name":"在吗 API"' /tmp/root.json \
            || { echo "::error::API 镜像的 / 未返回 JSON"; cat /tmp/root.json; exit 1; }

      - name: 记录镜像体积
        run: |
          size=$(docker image inspect zaima-api:ci --format '{{.Size}}')
          human=$(docker images zaima-api:ci --format '{{.Size}}')
          echo "API 镜像：${human}（${size} bytes）"
          {
            echo ""
            echo "| 镜像 | 体积 |"
            echo "| --- | --- |"
            echo "| API（无前端） | ${human} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 收集容器日志
        if: always()
        run: docker logs zaima-smoke 2>&1 | tail -50 || true

  app-image:
    name: 一体化镜像（API + H5）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 该镜像内含前端构建产物，容器一启动就能在浏览器打开 H5，用于排查问题
      - name: 构建一体化镜像（不推送）
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.app
          push: false
          load: true
          tags: zaima-app:ci
          build-args: |
            APP_VERSION=ci
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=zaima-app
          cache-to: type=gha,scope=zaima-app,mode=max
          provenance: false
          sbom: false

      - name: 启动冒烟：首页 + 接口
        run: |
          set -euo pipefail
          docker run -d --name zaima-app-smoke -p 18080:8000 zaima-app:ci
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/api/health > /tmp/health.json 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "${ok}" != "1" ]; then
            echo "::error::一体化镜像启动失败"
            docker logs zaima-app-smoke
            exit 1
          fi
          # 调试镜像必须真的带上前端产物
          docker run --rm --entrypoint sh zaima-app:ci -c 'test -f /app/static/index.html' \
            || { echo "::error::调试镜像缺少 /app/static/index.html"; exit 1; }
          curl -fsS http://127.0.0.1:18080/ -o /tmp/index.html
          grep -qi '<div id="app"' /tmp/index.html || { echo "::error::首页未返回 H5 入口"; exit 1; }
          # 静态资源必须可访问，否则页面白屏
          asset=$(grep -oE '(\./)?assets/[A-Za-z0-9._-]+\.(js|css)' /tmp/index.html | head -1)
          echo "探测静态资源: ${asset}"
          curl -fsS "http://127.0.0.1:18080/${asset#./}" -o /dev/null
          # 托管范围必须收窄：只允许 / 与 /assets/*，其它路径一律 404
          for path in /index.html /pages/index/index /app/main.py; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080${path}")
            echo "GET ${path} -> ${code}"
            test "${code}" = "404" || { echo "::error::${path} 应返回 404，实际 ${code}"; exit 1; }
          done
          cat /tmp/health.json
          echo "一体化镜像冒烟通过：/ 与 /api/health 可用，越权路径已拦截"

      - name: 收集容器日志
        if: always()
        run: docker logs zaima-app-smoke 2>&1 | tail -50 || true

      - name: 记录镜像体积
        run: |
          human=$(docker images zaima-app:ci --format '{{.Size}}')
          echo "调试镜像（API + H5）：${human}"
          {
            echo "| 调试镜像（API + H5） | ${human} |"
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: CI 汇总
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks, docker-build, app-image]
    if: always()
    steps:
      - name: 写入构建摘要
        run: |
          set -euo pipefail
          {
            echo "## 在吗 CI"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 触发事件 | \`${{ github.event_name }}\` |"
            echo "| 分支 / 引用 | \`${{ github.ref_name }}\` |"
            echo "| 提交 SHA | \`${{ github.sha }}\` |"
            echo "| 后端测试 (sqlite) | ${{ needs.backend-tests.result }} |"
            echo "| 前端检查 | ${{ needs.frontend-checks.result }} |"
            echo "| Dockerfile 构建（API 镜像） | ${{ needs.docker-build.result }} |"
            echo "| 一体化镜像（API + H5） | ${{ needs.app-image.result }} |"
            echo "| 镜像推送 | 未执行（PR 流程不发布） |"
            echo ""
            echo "> 通过条件：所有检查均为 success。任一失败时本工作流为失败，不进入发布流程。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 检查整体结果
        run: |
          set -euo pipefail
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::存在失败的检查项"
            exit 1
          fi
          echo "全部检查通过"
