name: Deploy H5 to Cloudflare Pages

# =============================================================================
# 用 GitHub Actions 构建 H5，再把静态产物部署到 Cloudflare Pages。
#
# 为什么这样最省事（已踩过的坑都避开）：
#   1. Cloudflare 不参与构建 —— 不会再出现 "Vite >= 6 才能自动配置" 的报错
#      （那是连 Git 后 Cloudflare 自己构建、强套 Vite 集成导致的；这里由 GitHub 用 Vite 5.2.8 构建）。
#   2. 不使用 Cloudflare 的 "部署命令" 字段 —— 不会再出现 Authentication error [code: 10000]
#      （那个字段会让你填 wrangler，且用到的 token 没有 Pages 写权限）。
#   3. 改用官方 cloudflare/pages-action，通过仓库 Secrets 的 API Token 部署，干净可控。
#
# 前置（一次性）：
#   - Cloudflare Pages 项目 zaima-h5 用 "Direct Upload" 方式创建（不要 Connect to Git）。
#   - 仓库 Settings → Secrets 增加：
#       CLOUDFLARE_API_TOKEN   （Account 级 "Cloudflare Pages: Edit" 权限的 API Token）
#       CLOUDFLARE_ACCOUNT_ID  （你的 Cloudflare 账户 ID）
# =============================================================================

on:
  # 仅在 main 分支、且前端代码有变化时触发（避免无关改动也重新部署）
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 拉取源码
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 Node 22（与 .nvmrc 一致），启用 npm 缓存
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 严格按 lockfile 安装依赖
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 计算版本号与构建号（构建号 = 提交短哈希），注入前端产物
      - name: Compute version and build
        id: ver
        working-directory: frontend
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 构建 H5 静态站点（产物：frontend/dist/build/h5）
      - name: Build H5
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ steps.ver.outputs.version }}
          VITE_APP_BUILD: ${{ steps.ver.outputs.build }}
        run: npm run build:h5

      # 用官方 Action 把产物上传到 Cloudflare Pages 项目 zaima-h5
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: zaima-h5
          directory: frontend/dist/build/h5
          branch: main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
