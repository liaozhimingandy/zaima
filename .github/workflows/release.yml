name: Release

# 触发：
# - push 到 main：测试 + 构建前端产物（不构建镜像）
# - push v* Tag：完整发布；版本号采用 Django 风格（参考 docs.djangoproject.com/en/6.1/internals/release-process/）
#     vA.B      功能发布 feature release，如 v1.0 / v2.1
#     vA.B.C    补丁发布 patch release，如 v1.0.1 / v2.1.3
#     vA.B(a|b|rc)N 预发布 alpha/beta/rc，如 v1.0a1 / v1.0rc1 / v1.0-rc1（不占用 latest）
# - 手动：默认只构建不发布，必须显式勾选 publish 才会发布
#
# 镜像构建/推送已拆分到 build-images.yml（公共层，其它项目也会直接拉取），
# 触发时机与本工作流一致；本工作流只负责测试、前端产物与 GitHub Release。
on:
  push:
    branches: [main]
    tags: ['v*']
    # 只在这些路径变化时跑（避免仅改 CI/文档也触发整套发布）。
    # 注意：GitHub 对 tag 推送不评估 paths，因此 v* 发布不受影响。
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'Dockerfile.app'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: '是否推送镜像到 Docker Hub（仅 main 或 v* Tag 允许）'
        type: boolean
        default: false
      force_tag:
        description: '允许覆盖已存在的版本镜像标签（危险，仅用于修复失败发布）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'
  REGISTRY: docker.io

jobs:
  # ------------------------------------------------------------------
  # 1. 版本与发布策略（唯一决策点）
  # ------------------------------------------------------------------
  meta:
    name: 计算版本与发布策略
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.calc.outputs.version }}
      short_sha: ${{ steps.calc.outputs.short_sha }}
      image: ${{ steps.calc.outputs.image }}
      app_image: ${{ steps.calc.outputs.app_image }}
      tags: ${{ steps.calc.outputs.tags }}
      app_tags: ${{ steps.calc.outputs.app_tags }}
      h5_tags: ${{ steps.calc.outputs.h5_tags }}
      h5_assets_tags: ${{ steps.calc.outputs.h5_assets_tags }}
      should_push: ${{ steps.calc.outputs.should_push }}
      is_release: ${{ steps.calc.outputs.is_release }}
      is_prerelease: ${{ steps.calc.outputs.is_prerelease }}
      has_docker_config: ${{ steps.calc.outputs.has_docker_config }}
    steps:
      - name: 计算版本号、镜像标签与是否发布
        id: calc
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_FORCE: ${{ inputs.force_tag }}
          DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}
          ENABLE_FLOATING_TAGS: ${{ vars.ENABLE_FLOATING_TAGS }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          FULL_SHA="${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA::7}"
          # Django 风格版本号（参考 https://docs.djangoproject.com/en/6.1/internals/release-process/）：
          #   vA.B          功能发布 feature release，如 v1.0 / v2.1
          #   vA.B.C        补丁发布 patch release，如 v1.0.1 / v2.1.3
          #   vA.B(a|b|rc)N 预发布 alpha/beta/rc，如 v1.0a1 / v1.0rc1
          #   vA.B-(a|b|rc)N 同上，连字符写法，如 v1.0-rc1（两种都接受）
          #   vA.B.C(a|b|rc)N 补丁的预发布
          SEMVER_RE='^v[0-9]+\.[0-9]+(\.[0-9]+)?(-?(a|b|rc)[0-9]+)?$'

          VERSION=""
          SHOULD_PUSH="false"
          IS_RELEASE="false"
          IS_PRERELEASE="false"
          FLOATING="false"

          if [ "${EVENT_NAME}" = "push" ] && [ "${REF_TYPE}" = "tag" ]; then
            if ! [[ "${REF_NAME}" =~ ${SEMVER_RE} ]]; then
              echo "::error::Tag ${REF_NAME} 不符合规范（应形如 v1.0 功能发布 / v1.0.1 补丁发布；预发布 v1.0a1 / v1.0rc1 / v1.0-rc1）"
              exit 1
            fi
            VERSION="${REF_NAME#v}"
            SHOULD_PUSH="true"
            IS_RELEASE="true"
            [[ "${VERSION}" =~ (a|b|rc)[0-9]+$ ]] && IS_PRERELEASE="true"
            FLOATING="${ENABLE_FLOATING_TAGS:-false}"
          elif [ "${EVENT_NAME}" = "push" ]; then
            if [ "${REF_NAME}" = "main" ]; then
              VERSION="dev"
              SHOULD_PUSH="true"
            else
              VERSION="dev"
              SHOULD_PUSH="false"
            fi
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${INPUT_PUBLISH}" = "true" ]; then
              if [ "${REF_TYPE}" = "tag" ]; then
                if ! [[ "${REF_NAME}" =~ ${SEMVER_RE} ]]; then
                  echo "::error::手动发布只能基于规范 Tag（v1.0 / v1.0.1 / v1.0rc1 / v1.0-rc1），当前为 ${REF_NAME}"
                  exit 1
                fi
                VERSION="${REF_NAME#v}"
                IS_RELEASE="true"
                [[ "${VERSION}" =~ (a|b|rc)[0-9]+$ ]] && IS_PRERELEASE="true"
              elif [ "${REF_NAME}" = "main" ]; then
                VERSION="dev"
              else
                echo "::error::手动发布只允许在 main 分支或 v* Tag 上执行，当前分支为 ${REF_NAME}"
                exit 1
              fi
              SHOULD_PUSH="true"
              FLOATING="${ENABLE_FLOATING_TAGS:-false}"
            else
              VERSION="dev"
            fi
          fi

          if [ -z "${VERSION}" ]; then
            echo "::error::无法确定版本号"
            exit 1
          fi

          # 统一到单一镜像仓库：优先仓库变量 DOCKER_REPOSITORY，否则默认 <owner>/zaima。
          # 所有镜像共用该仓库，用标签前缀区分用途（<ver> / latest / sha-<sha>；一体化 app-*）。
          if [ -n "${DOCKER_REPOSITORY}" ]; then
            IMAGE="${DOCKER_REPOSITORY}"
          else
            IMAGE="${GITHUB_REPOSITORY_OWNER}/zaima"
          fi
          HAS_CFG="true"

          # 从版本号提取主/次版本（功能发布 vA.B 与补丁发布 vA.B.C 通用）
          MAJOR=$(echo "${VERSION}" | cut -d. -f1)
          MINOR=$(echo "${VERSION}" | cut -d. -f2)

          TAGS=""
          if [ "${HAS_CFG}" = "true" ]; then
            # 精确版本标签（不可变，每一次发布唯一对应一个 Git Tag）
            TAGS="${IMAGE}:${VERSION}"
            TAGS="${TAGS}"$'\n'"${IMAGE}:sha-${FULL_SHA}"
            # latest 仅给稳定版；预发布（alpha/beta/rc）不占用，避免把未稳定版本当成最新
            if [ "${IS_RELEASE}" = "true" ] && [ "${IS_PRERELEASE}" != "true" ]; then
              TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
            fi
            # 浮动标签：A.B 指向该小版本最新补丁（Django 风格，v1.0.1 会滚动更新 v1.0），
            # A 指向该大版本最新（需显式开启 ENABLE_FLOATING_TAGS；预发布不参与，避免污染滚动标签）
            if [ "${FLOATING}" = "true" ] && [ "${IS_PRERELEASE}" != "true" ]; then
              TAGS="${TAGS}"$'\n'"${IMAGE}:${MAJOR}.${MINOR}"
              TAGS="${TAGS}"$'\n'"${IMAGE}:${MAJOR}"
            fi
            # 去重并保持顺序
            TAGS=$(printf '%s\n' "${TAGS}" | awk 'NF && !seen[$0]++')
          fi

          # 一体化调试镜像（API + H5）与后端同一仓库，用 app- 前缀区分，避免多仓库管理。
          APP_IMAGE="${IMAGE}"

          APP_TAGS=""
          if [ "${HAS_CFG}" = "true" ]; then
            APP_TAGS="${APP_IMAGE}:app-${VERSION}"
            APP_TAGS="${APP_TAGS}"$'\n'"${APP_IMAGE}:app-sha-${FULL_SHA}"
            if [ "${IS_RELEASE}" = "true" ] && [ "${IS_PRERELEASE}" != "true" ]; then
              APP_TAGS="${APP_TAGS}"$'\n'"${APP_IMAGE}:app-latest"
            fi
            if [ "${FLOATING}" = "true" ] && [ "${IS_PRERELEASE}" != "true" ]; then
              APP_TAGS="${APP_TAGS}"$'\n'"${APP_IMAGE}:app-${MAJOR}.${MINOR}"
              APP_TAGS="${APP_TAGS}"$'\n'"${APP_IMAGE}:app-${MAJOR}"
            fi
            APP_TAGS=$(printf '%s\n' "${APP_TAGS}" | awk 'NF && !seen[$0]++')
          fi

          # 前端 H5 镜像：与后端同仓库，用 h5- / h5-assets- 前缀区分。
          # main 与稳定发布都滚动 h5-latest；预发布不覆盖 latest。
          H5_TAGS="${IMAGE}:h5-${VERSION}"
          H5_TAGS="${H5_TAGS}"$'\n'"${IMAGE}:h5-sha-${SHORT_SHA}"
          H5_ASSETS_TAGS="${IMAGE}:h5-assets-${VERSION}"
          H5_ASSETS_TAGS="${H5_ASSETS_TAGS}"$'\n'"${IMAGE}:h5-assets-sha-${SHORT_SHA}"
          if { [ "${IS_RELEASE}" = "true" ] && [ "${IS_PRERELEASE}" != "true" ]; } || { [ "${EVENT_NAME}" = "push" ] && [ "${REF_NAME}" = "main" ]; }; then
            H5_TAGS="${H5_TAGS}"$'\n'"${IMAGE}:h5-latest"
            H5_ASSETS_TAGS="${H5_ASSETS_TAGS}"$'\n'"${IMAGE}:h5-assets-latest"
          fi
          H5_TAGS=$(printf '%s\n' "${H5_TAGS}" | awk 'NF && !seen[$0]++')
          H5_ASSETS_TAGS=$(printf '%s\n' "${H5_ASSETS_TAGS}" | awk 'NF && !seen[$0]++')

          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "image=${IMAGE}"
            echo "app_image=${APP_IMAGE}"
            echo "should_push=${SHOULD_PUSH}"
            echo "is_release=${IS_RELEASE}"
            echo "is_prerelease=${IS_PRERELEASE}"
            echo "has_docker_config=${HAS_CFG}"
            echo "tags<<TAGS_EOF"
            echo "${TAGS}"
            echo "TAGS_EOF"
            echo "app_tags<<APP_TAGS_EOF"
            echo "${APP_TAGS}"
            echo "APP_TAGS_EOF"
            echo "h5_tags<<H5_TAGS_EOF"
            echo "${H5_TAGS}"
            echo "H5_TAGS_EOF"
            echo "h5_assets_tags<<H5_ASSETS_EOF"
            echo "${H5_ASSETS_TAGS}"
            echo "H5_ASSETS_EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 发布策略"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 事件 | \`${EVENT_NAME}\` |"
            echo "| 引用 | \`${REF_TYPE}:${REF_NAME}\` |"
            echo "| 版本 | \`${VERSION}\` |"
            echo "| 提交 | \`${FULL_SHA}\` |"
            echo "| 镜像仓库 | \`${IMAGE}\` |"
            echo "| 是否推送 | \`${SHOULD_PUSH}\` |"
            echo "| 正式发布 | \`${IS_RELEASE}\` |"
            if [ "${IS_RELEASE}" = "true" ]; then
              if [ "${IS_PRERELEASE}" = "true" ]; then
                RTYPE="预发布（alpha/beta/rc）"
              elif [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                RTYPE="补丁发布 patch（A.B.C）"
              else
                RTYPE="功能发布 feature（A.B）"
              fi
              echo "| 发布类型 | \`${RTYPE}\` |"
            fi
            echo ""
            echo '```'
            echo "${TAGS:-（不推送）}"
            echo '```'
            echo ""
            echo "以下镜像标签由独立的 Build Images 工作流使用（本工作流不构建镜像）："
            echo ""
            echo '```'
            echo "${APP_TAGS:-（不推送）}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 2. 后端测试（发布前必须通过）
  # ------------------------------------------------------------------
  backend-tests:
    name: 后端测试 / ${{ matrix.database }}
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zaima
          POSTGRES_PASSWORD: zaima
          POSTGRES_DB: zaima_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zaima -d zaima_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://zaima:zaima@localhost:5432/zaima_test' || '' }}
      DATABASE_URL: postgresql+psycopg://zaima:zaima@localhost:5432/zaima_test
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Alembic 迁移往返（postgres）
        if: matrix.database == 'postgres'
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

      - name: 运行测试
        working-directory: backend
        run: pytest -q --junitxml=pytest-${{ matrix.database }}.xml

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-report-${{ needs.meta.outputs.version }}-${{ matrix.database }}
          path: backend/pytest-${{ matrix.database }}.xml
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------
  # 3. 前端检查
  # ------------------------------------------------------------------
  frontend-checks:
    name: 前端检查
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（严格按锁文件）
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund

      - name: TypeScript 类型检查
        run: npm run type-check

      - name: ESLint（未配置则跳过）
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "::notice title=Lint 未配置::package.json 中没有 lint 脚本，本步骤跳过"
          fi

      - name: 前端测试（未配置则跳过）
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm run test
          else
            echo "::notice title=前端测试未配置::package.json 中没有 test 脚本，本步骤跳过"
          fi

  # ------------------------------------------------------------------
  # 4. 前端三平台产物
  # ------------------------------------------------------------------
  frontend-artifacts:
    name: 前端构建与产物上传
    needs: [meta, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_APP_VERSION: ${{ needs.meta.outputs.version }}
      # 构建号 = 提交短哈希，注入前端产物，便于线上排查
      VITE_APP_BUILD: ${{ needs.meta.outputs.short_sha }}
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund

      - name: 构建 H5
        if: ${{ vars.BUILD_H5 != 'false' }}
        run: npm run build:h5

      - name: 构建微信小程序
        if: ${{ vars.BUILD_MP_WEIXIN != 'false' }}
        run: npm run build:mp-weixin

      - name: 构建支付宝小程序
        if: ${{ vars.BUILD_MP_ALIPAY != 'false' }}
        run: npm run build:mp-alipay

      - name: 校验产物与敏感信息
        run: |
          set -euo pipefail
          for p in h5 mp-weixin mp-alipay; do
            if [ -d "dist/build/$p" ]; then
              echo "== $p: $(find dist/build/$p -type f | wc -l) 个文件"
            fi
          done
          test -f dist/build/h5/index.html
          test -f dist/build/mp-weixin/app.json
          test -f dist/build/mp-alipay/app.json
          if find dist/build -maxdepth 1 -name '.env*' | grep -q .; then
            echo "::error::产物目录中发现 .env 文件"
            exit 1
          fi
          if find dist/build -name '.env*' | grep -q .; then
            echo "::error::产物中发现 .env 文件"
            exit 1
          fi
          echo "产物校验通过，未发现 .env 文件"

      - name: 上传 H5 产物
        if: ${{ vars.BUILD_H5 != 'false' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zaima-frontend-h5-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.short_sha }}
          path: frontend/dist/build/h5
          retention-days: 30
          if-no-files-found: error

      - name: 上传微信小程序产物
        if: ${{ vars.BUILD_MP_WEIXIN != 'false' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zaima-frontend-mp-weixin-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.short_sha }}
          path: frontend/dist/build/mp-weixin
          retention-days: 30
          if-no-files-found: error

      - name: 上传支付宝小程序产物
        if: ${{ vars.BUILD_MP_ALIPAY != 'false' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zaima-frontend-mp-alipay-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.short_sha }}
          path: frontend/dist/build/mp-alipay
          retention-days: 30
          if-no-files-found: error

      - name: Android / iOS 构建能力检查
        run: |
          echo "::notice title=App 原生构建未配置::uni-app 的 Android/iOS 安装包需要 HBuilderX 云打包或离线原生工程 + 签名证书，当前仓库未配置，本流程不产出 ipa/apk（H5 产物不能代替原生安装包）。"

  # ------------------------------------------------------------------
  # 6. GitHub Release（仅正式 Tag）
  # ------------------------------------------------------------------
  github-release:
    name: 创建 GitHub Release
    needs: [meta, backend-tests, frontend-checks]
    if: needs.meta.outputs.is_release == 'true' && needs.meta.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE: ${{ needs.meta.outputs.image }}
      IS_PRERELEASE: ${{ needs.meta.outputs.is_prerelease }}
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 创建 Release（已存在则跳过）
        run: |
          set -euo pipefail
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "::notice title=Release 已存在::${TAG} 已发布，保持不可变，跳过创建"
            exit 0
          fi
          NOTES="镜像：\`${IMAGE}:${VERSION}\`

          本版本由 GitHub Actions 自动构建，镜像标签与 Git Tag 一一对应。
          部署时建议使用 Digest 固定版本。"
          PRERELEASE_FLAG=""
          if [ "${IS_PRERELEASE}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
            NOTES="${NOTES}

          > 注意：这是预发布版本（alpha/beta/rc），仅供测试，请勿用于生产环境。"
          fi
          # shellcheck disable=SC2086
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            ${PRERELEASE_FLAG} \
            --notes "${NOTES}" \
            --verify-tag

  # ------------------------------------------------------------------
  # 7. 发布报告：把本次运行的关键信息汇总到 Actions 页面
  # ------------------------------------------------------------------
  report:
    name: 发布报告
    needs: [meta, backend-tests, frontend-checks, frontend-artifacts, github-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 写入发布摘要
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SHORT_SHA: ${{ needs.meta.outputs.short_sha }}
          IMAGE_NAME: ${{ needs.meta.outputs.image }}
          SHOULD_PUSH: ${{ needs.meta.outputs.should_push }}
          IS_RELEASE: ${{ needs.meta.outputs.is_release }}
          R_META: ${{ needs.meta.result }}
          R_BACKEND: ${{ needs.backend-tests.result }}
          R_FRONTEND: ${{ needs.frontend-checks.result }}
          R_ARTIFACTS: ${{ needs.frontend-artifacts.result }}
          R_RELEASE: ${{ needs.github-release.result }}
        run: |
          set -euo pipefail
          {
            echo "## 在吗 · 发布报告"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 触发事件 | \`${GITHUB_EVENT_NAME}\` |"
            echo "| 分支 / Tag | \`${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}\` |"
            echo "| 完整提交 SHA | \`${GITHUB_SHA}\` |"
            echo "| 版本 | \`${VERSION}\` |"
            echo "| 正式发布 | \`${IS_RELEASE}\` |"
            echo ""
            echo "### 检查结果"
            echo ""
            echo "| 阶段 | 结果 |"
            echo "| --- | --- |"
            echo "| 版本计算 | ${R_META} |"
            echo "| 后端测试 | ${R_BACKEND} |"
            echo "| 前端检查 | ${R_FRONTEND} |"
            echo "| 前端产物 | ${R_ARTIFACTS} |"
            echo "| GitHub Release | ${R_RELEASE} |"
            echo ""
            echo "### 产物"
            echo ""
            echo "| 类型 | 名称 |"
            echo "| --- | --- |"
            echo "| Artifact | \`zaima-frontend-h5-${VERSION}-${SHORT_SHA}\` |"
            echo "| Artifact | \`zaima-frontend-mp-weixin-${VERSION}-${SHORT_SHA}\` |"
            echo "| Artifact | \`zaima-frontend-mp-alipay-${VERSION}-${SHORT_SHA}\` |"
            echo "| 镜像 | 由独立工作流 \`Build Images\` 构建：\`${IMAGE_NAME}:${VERSION}\` / \`:app-${VERSION}\` / \`:h5-${VERSION}\`（是否推送：\`${SHOULD_PUSH}\`） |"
            echo ""
            echo "> 镜像构建/推送由本仓库的 \`Build Images\` 工作流执行（与 Release 同时触发），详情见该次运行摘要。"
            echo "> 只有全部阶段为 \`success\`（跳过项显示 \`skipped\`）时，本次发布才算完成。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 判定整体结果
        run: |
          set -euo pipefail
          failed=""
          for entry in \
            "版本计算:${{ needs.meta.result }}" \
            "后端测试:${{ needs.backend-tests.result }}" \
            "前端检查:${{ needs.frontend-checks.result }}" \
            "前端产物:${{ needs.frontend-artifacts.result }}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              failed="${failed} ${name}"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "::error title=发布未完成::失败阶段:${failed}"
            exit 1
          fi
          echo "全部阶段成功"
