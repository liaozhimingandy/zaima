name: Release

# 触发：
# - push 到 main：构建前端产物 + 推送开发镜像 dev-<sha>
# - push v* Tag：完整发布；版本号采用 Django 风格（参考 docs.djangoproject.com/en/6.1/internals/release-process/）
#     vA.B      功能发布 feature release，如 v1.0 / v2.1
#     vA.B.C    补丁发布 patch release，如 v1.0.1 / v2.1.3
#     vA.B(a|b|rc)N 预发布 alpha/beta/rc，如 v1.0a1 / v1.0rc2（不占用 latest）
#   镜像标签：精确 <ver> / sha-<sha> / latest；开启 ENABLE_FLOATING_TAGS 再加 A.B（滚动到该小版本最新补丁）与 A
# - 手动：默认只构建不发布，必须显式勾选 publish 才会推送镜像
on:
  push:
    branches: [main]
    tags: ['v*']
    # 只在这些路径变化时跑（避免仅改 CI/文档也触发整套发布）。
    # 注意：GitHub 对 tag 推送不评估 paths，因此 v* 发布不受影响。
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'Dockerfile.app'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: '是否推送镜像到 Docker Hub（仅 main 或 v* Tag 允许）'
        type: boolean
        default: false
      force_tag:
        description: '允许覆盖已存在的版本镜像标签（危险，仅用于修复失败发布）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'
  REGISTRY: docker.io

jobs:
  # ------------------------------------------------------------------
  # 1. 版本与发布策略（唯一决策点）
  # ------------------------------------------------------------------
  meta:
    name: 计算版本与发布策略
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.calc.outputs.version }}
      short_sha: ${{ steps.calc.outputs.short_sha }}
      image: ${{ steps.calc.outputs.image }}
      app_image: ${{ steps.calc.outputs.app_image }}
      tags: ${{ steps.calc.outputs.tags }}
      app_tags: ${{ steps.calc.outputs.app_tags }}
      h5_tags: ${{ steps.calc.outputs.h5_tags }}
      h5_assets_tags: ${{ steps.calc.outputs.h5_assets_tags }}
      should_push: ${{ steps.calc.outputs.should_push }}
      is_release: ${{ steps.calc.outputs.is_release }}
      is_prerelease: ${{ steps.calc.outputs.is_prerelease }}
      has_docker_config: ${{ steps.calc.outputs.has_docker_config }}
    steps:
      - name: 计算版本号、镜像标签与是否发布
        id: calc
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_FORCE: ${{ inputs.force_tag }}
          DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}
          ENABLE_FLOATING_TAGS: ${{ vars.ENABLE_FLOATING_TAGS }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          FULL_SHA="${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA::7}"
          # Django 风格版本号（参考 https://docs.djangoproject.com/en/6.1/internals/release-process/）：
          #   vA.B          功能发布 feature release，如 v1.0 / v2.1
          #   vA.B.C        补丁发布 patch release，如 v1.0.1 / v2.1.3
          #   vA.B(a|b|rc)N 预发布 alpha/beta/rc，如 v1.0a1 / v1.0rc2
          #   vA.B.C(a|b|rc)N 补丁的预发布
          SEMVER_RE='^v[0-9]+\.[0-9]+(\.[0-9]+)?((a|b|rc)[0-9]+)?$'

          VERSION=""
          SHOULD_PUSH="false"
          IS_RELEASE="false"
          IS_PRERELEASE="false"
          FLOATING="false"

          if [ "${EVENT_NAME}" = "push" ] && [ "${REF_TYPE}" = "tag" ]; then
            if ! [[ "${REF_NAME}" =~ ${SEMVER_RE} ]]; then
              echo "::error::Tag ${REF_NAME} 不符合规范（应形如 v1.0 功能发布 / v1.0.1 补丁发布；预发布 v1.0a1 / v1.0rc1）"
              exit 1
            fi
            VERSION="${REF_NAME#v}"
            SHOULD_PUSH="true"
            IS_RELEASE="true"
            [[ "${VERSION}" =~ (a|b|rc)[0-9]+$ ]] && IS_PRERELEASE="true"
            FLOATING="${ENABLE_FLOATING_TAGS:-false}"
          elif [ "${EVENT_NAME}" = "push" ]; then
            if [ "${REF_NAME}" = "main" ]; then
              VERSION="dev-${SHORT_SHA}"
              SHOULD_PUSH="true"
            else
              VERSION="dev-${SHORT_SHA}"
              SHOULD_PUSH="false"
            fi
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${INPUT_PUBLISH}" = "true" ]; then
              if [ "${REF_TYPE}" = "tag" ]; then
                if ! [[ "${REF_NAME}" =~ ${SEMVER_RE} ]]; then
                  echo "::error::手动发布只能基于规范 Tag（v1.0 / v1.0.1 / v1.0rc1），当前为 ${REF_NAME}"
                  exit 1
                fi
                VERSION="${REF_NAME#v}"
                IS_RELEASE="true"
                [[ "${VERSION}" =~ (a|b|rc)[0-9]+$ ]] && IS_PRERELEASE="true"
              elif [ "${REF_NAME}" = "main" ]; then
                VERSION="dev-${SHORT_SHA}"
              else
                echo "::error::手动发布只允许在 main 分支或 v* Tag 上执行，当前分支为 ${REF_NAME}"
                exit 1
              fi
              SHOULD_PUSH="true"
              FLOATING="${ENABLE_FLOATING_TAGS:-false}"
            else
              VERSION="dev-${SHORT_SHA}"
            fi
          fi

          if [ -z "${VERSION}" ]; then
            echo "::error::无法确定版本号"
            exit 1
          fi

          # 统一到单一镜像仓库：优先仓库变量 DOCKER_REPOSITORY，否则默认 <owner>/zaima。
          # 所有镜像共用该仓库，用标签前缀区分用途（<ver> / latest / sha-<sha>；一体化 app-*）。
          if [ -n "${DOCKER_REPOSITORY}" ]; then
            IMAGE="${DOCKER_REPOSITORY}"
          else
            IMAGE="${GITHUB_REPOSITORY_OWNER}/zaima"
          fi
          HAS_CFG="true"

          # 从版本号提取主/次版本（功能发布 vA.B 与补丁发布 vA.B.C 通用）
          MAJOR=$(echo "${VERSION}" | cut -d. -f1)
          MINOR=$(echo "${VERSION}" | cut -d. -f2)

          TAGS=""
          if [ "${HAS_CFG}" = "true" ]; then
            # 精确版本标签（不可变，每一次发布唯一对应一个 Git Tag）
            TAGS="${IMAGE}:${VERSION}"
            TAGS="${TAGS}"$'\n'"${IMAGE}:sha-${FULL_SHA}"
            # latest 仅给稳定版；预发布（alpha/beta/rc）不占用，避免把未稳定版本当成最新
            if [ "${IS_RELEASE}" = "true" ] && [ "${IS_PRERELEASE}" != "true" ]; then
              TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
            fi
            # 浮动标签：A.B 指向该小版本最新补丁（Django 风格，v1.0.1 会滚动更新 v1.0），
            # A 指向该大版本最新（需显式开启 ENABLE_FLOATING_TAGS；预发布不参与，避免污染滚动标签）
            if [ "${FLOATING}" = "true" ] && [ "${IS_PRERELEASE}" != "true" ]; then
              TAGS="${TAGS}"$'\n'"${IMAGE}:${MAJOR}.${MINOR}"
              TAGS="${TAGS}"$'\n'"${IMAGE}:${MAJOR}"
            fi
            # 去重并保持顺序
            TAGS=$(printf '%s\n' "${TAGS}" | awk 'NF && !seen[$0]++')
          fi

          # 一体化调试镜像（API + H5）与后端同一仓库，用 app- 前缀区分，避免多仓库管理。
          APP_IMAGE="${IMAGE}"

          APP_TAGS=""
          if [ "${HAS_CFG}" = "true" ]; then
            APP_TAGS="${APP_IMAGE}:app-${VERSION}"
            APP_TAGS="${APP_TAGS}"$'\n'"${APP_IMAGE}:app-sha-${FULL_SHA}"
            if [ "${IS_RELEASE}" = "true" ] && [ "${IS_PRERELEASE}" != "true" ]; then
              APP_TAGS="${APP_TAGS}"$'\n'"${APP_IMAGE}:app-latest"
            fi
            if [ "${FLOATING}" = "true" ] && [ "${IS_PRERELEASE}" != "true" ]; then
              APP_TAGS="${APP_TAGS}"$'\n'"${APP_IMAGE}:app-${MAJOR}.${MINOR}"
              APP_TAGS="${APP_TAGS}"$'\n'"${APP_IMAGE}:app-${MAJOR}"
            fi
            APP_TAGS=$(printf '%s\n' "${APP_TAGS}" | awk 'NF && !seen[$0]++')
          fi

          # 前端 H5 镜像：与后端同仓库，用 h5- / h5-assets- 前缀区分。
          # main 与稳定发布都滚动 h5-latest；预发布不覆盖 latest。
          H5_TAGS="${IMAGE}:h5-${VERSION}"
          H5_TAGS="${H5_TAGS}"$'\n'"${IMAGE}:h5-sha-${SHORT_SHA}"
          H5_ASSETS_TAGS="${IMAGE}:h5-assets-${VERSION}"
          H5_ASSETS_TAGS="${H5_ASSETS_TAGS}"$'\n'"${IMAGE}:h5-assets-sha-${SHORT_SHA}"
          if { [ "${IS_RELEASE}" = "true" ] && [ "${IS_PRERELEASE}" != "true" ]; } || { [ "${EVENT_NAME}" = "push" ] && [ "${REF_NAME}" = "main" ]; }; then
            H5_TAGS="${H5_TAGS}"$'\n'"${IMAGE}:h5-latest"
            H5_ASSETS_TAGS="${H5_ASSETS_TAGS}"$'\n'"${IMAGE}:h5-assets-latest"
          fi
          H5_TAGS=$(printf '%s\n' "${H5_TAGS}" | awk 'NF && !seen[$0]++')
          H5_ASSETS_TAGS=$(printf '%s\n' "${H5_ASSETS_TAGS}" | awk 'NF && !seen[$0]++')

          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "image=${IMAGE}"
            echo "app_image=${APP_IMAGE}"
            echo "should_push=${SHOULD_PUSH}"
            echo "is_release=${IS_RELEASE}"
            echo "is_prerelease=${IS_PRERELEASE}"
            echo "has_docker_config=${HAS_CFG}"
            echo "tags<<TAGS_EOF"
            echo "${TAGS}"
            echo "TAGS_EOF"
            echo "app_tags<<APP_TAGS_EOF"
            echo "${APP_TAGS}"
            echo "APP_TAGS_EOF"
            echo "h5_tags<<H5_TAGS_EOF"
            echo "${H5_TAGS}"
            echo "H5_TAGS_EOF"
            echo "h5_assets_tags<<H5_ASSETS_EOF"
            echo "${H5_ASSETS_TAGS}"
            echo "H5_ASSETS_EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 发布策略"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 事件 | \`${EVENT_NAME}\` |"
            echo "| 引用 | \`${REF_TYPE}:${REF_NAME}\` |"
            echo "| 版本 | \`${VERSION}\` |"
            echo "| 提交 | \`${FULL_SHA}\` |"
            echo "| 镜像仓库 | \`${IMAGE}\` |"
            echo "| 是否推送 | \`${SHOULD_PUSH}\` |"
            echo "| 正式发布 | \`${IS_RELEASE}\` |"
            if [ "${IS_RELEASE}" = "true" ]; then
              if [ "${IS_PRERELEASE}" = "true" ]; then
                RTYPE="预发布（alpha/beta/rc）"
              elif [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                RTYPE="补丁发布 patch（A.B.C）"
              else
                RTYPE="功能发布 feature（A.B）"
              fi
              echo "| 发布类型 | \`${RTYPE}\` |"
            fi
            echo ""
            echo '```'
            echo "${TAGS:-（不推送）}"
            echo '```'
            echo ""
            echo "测试镜像（API + H5，含 /app/static，仅用于测试/演示）："
            echo ""
            echo '```'
            echo "${APP_TAGS:-（不推送）}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 2. 后端测试（发布前必须通过）
  # ------------------------------------------------------------------
  backend-tests:
    name: 后端测试 / ${{ matrix.database }}
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zaima
          POSTGRES_PASSWORD: zaima
          POSTGRES_DB: zaima_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zaima -d zaima_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://zaima:zaima@localhost:5432/zaima_test' || '' }}
      DATABASE_URL: postgresql+psycopg://zaima:zaima@localhost:5432/zaima_test
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Alembic 迁移往返（postgres）
        if: matrix.database == 'postgres'
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

      - name: 运行测试
        working-directory: backend
        run: pytest -q --junitxml=pytest-${{ matrix.database }}.xml

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-report-${{ needs.meta.outputs.version }}-${{ matrix.database }}
          path: backend/pytest-${{ matrix.database }}.xml
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------
  # 3. 前端检查
  # ------------------------------------------------------------------
  frontend-checks:
    name: 前端检查
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（严格按锁文件）
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund

      - name: TypeScript 类型检查
        run: npm run type-check

      - name: ESLint（未配置则跳过）
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "::notice title=Lint 未配置::package.json 中没有 lint 脚本，本步骤跳过"
          fi

      - name: 前端测试（未配置则跳过）
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm run test
          else
            echo "::notice title=前端测试未配置::package.json 中没有 test 脚本，本步骤跳过"
          fi

  # ------------------------------------------------------------------
  # 4. 前端三平台产物
  # ------------------------------------------------------------------
  frontend-artifacts:
    name: 前端构建与产物上传
    needs: [meta, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_APP_VERSION: ${{ needs.meta.outputs.version }}
      # 构建号 = 提交短哈希，注入前端产物，便于线上排查
      VITE_APP_BUILD: ${{ needs.meta.outputs.short_sha }}
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund

      - name: 构建 H5
        if: ${{ vars.BUILD_H5 != 'false' }}
        run: npm run build:h5

      - name: 构建微信小程序
        if: ${{ vars.BUILD_MP_WEIXIN != 'false' }}
        run: npm run build:mp-weixin

      - name: 构建支付宝小程序
        if: ${{ vars.BUILD_MP_ALIPAY != 'false' }}
        run: npm run build:mp-alipay

      - name: 校验产物与敏感信息
        run: |
          set -euo pipefail
          for p in h5 mp-weixin mp-alipay; do
            if [ -d "dist/build/$p" ]; then
              echo "== $p: $(find dist/build/$p -type f | wc -l) 个文件"
            fi
          done
          test -f dist/build/h5/index.html
          test -f dist/build/mp-weixin/app.json
          test -f dist/build/mp-alipay/app.json
          if find dist/build -maxdepth 1 -name '.env*' | grep -q .; then
            echo "::error::产物目录中发现 .env 文件"
            exit 1
          fi
          if find dist/build -name '.env*' | grep -q .; then
            echo "::error::产物中发现 .env 文件"
            exit 1
          fi
          echo "产物校验通过，未发现 .env 文件"

      - name: 上传 H5 产物
        if: ${{ vars.BUILD_H5 != 'false' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zaima-frontend-h5-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.short_sha }}
          path: frontend/dist/build/h5
          retention-days: 30
          if-no-files-found: error

      - name: 上传微信小程序产物
        if: ${{ vars.BUILD_MP_WEIXIN != 'false' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zaima-frontend-mp-weixin-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.short_sha }}
          path: frontend/dist/build/mp-weixin
          retention-days: 30
          if-no-files-found: error

      - name: 上传支付宝小程序产物
        if: ${{ vars.BUILD_MP_ALIPAY != 'false' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zaima-frontend-mp-alipay-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.short_sha }}
          path: frontend/dist/build/mp-alipay
          retention-days: 30
          if-no-files-found: error

      - name: Android / iOS 构建能力检查
        run: |
          echo "::notice title=App 原生构建未配置::uni-app 的 Android/iOS 安装包需要 HBuilderX 云打包或离线原生工程 + 签名证书，当前仓库未配置，本流程不产出 ipa/apk（H5 产物不能代替原生安装包）。"

  # ------------------------------------------------------------------
  # 4.5 前端 H5 镜像（复用上面已构建的 H5 产物，不重复构建）
  # ------------------------------------------------------------------
  h5-images:
    name: H5 镜像（nginx / scratch）
    needs: [meta, frontend-artifacts]
    # H5 构建被关闭时跳过（没有产物可复用）
    if: ${{ vars.BUILD_H5 != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 拉取源码（只需要 Dockerfile / Dockerfile.nginx）
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 直接复用 frontend-artifacts 上传的 H5 产物到 h5-dist/，避免二次 npm build
      - name: 下载 H5 产物
        uses: actions/download-artifact@v4
        with:
          name: zaima-frontend-h5-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.short_sha }}
          path: h5-dist

      # 产物缺失时给出清晰报错，而不是 Docker 的 cache key 错误
      - name: 校验 H5 产物
        run: test -f h5-dist/index.html || { echo "::error::h5-dist/index.html 缺失"; ls -la h5-dist || true; exit 1; }

      # 启用 Buildx 并利用 GHA 缓存
      - name: 配置 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 仅推送时登录
      - name: 登录 Docker Hub
        if: needs.meta.outputs.should_push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME || vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}

      # 可运行测试镜像：nginx:alpine + 产物 → zaima:h5-*
      - name: 构建并推送 H5 nginx 镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.nginx
          push: ${{ needs.meta.outputs.should_push == 'true' }}
          tags: ${{ needs.meta.outputs.h5_tags }}
          cache-from: type=gha,scope=zaima-h5
          cache-to: type=gha,scope=zaima-h5,mode=max
          provenance: false
          sbom: false

      # 纯产物镜像：scratch 空根 → zaima:h5-assets-*
      - name: 构建并推送 H5 静态产物镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ needs.meta.outputs.should_push == 'true' }}
          tags: ${{ needs.meta.outputs.h5_assets_tags }}
          cache-from: type=gha,scope=zaima-h5-assets
          cache-to: type=gha,scope=zaima-h5-assets,mode=max
          provenance: false
          sbom: false

      # 冒烟：拉起 nginx 镜像确认首页可访问
      - name: H5 nginx 镜像冒烟
        if: needs.meta.outputs.should_push == 'true'
        run: |
          set -euo pipefail
          REF=$(printf '%s\n' "${{ needs.meta.outputs.h5_tags }}" | head -1)
          docker pull "${REF}"
          docker run -d --name h5-smoke -p 18080:80 "${REF}"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ -o /tmp/index.html 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "${ok}" = "1" || { echo "::error::H5 nginx 镜像启动失败"; docker logs h5-smoke; exit 1; }
          grep -qi '<div id="app"' /tmp/index.html || { echo "::error::首页未返回 H5 入口"; cat /tmp/index.html; exit 1; }
          echo "H5 nginx 镜像冒烟通过"
          docker rm -f h5-smoke

  # ------------------------------------------------------------------
  # 5. Docker 镜像构建与条件推送
  # ------------------------------------------------------------------
  docker:
    name: 镜像构建与发布
    needs: [meta, backend-tests, frontend-checks, frontend-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ needs.meta.outputs.image }}
      APP_IMAGE: ${{ needs.meta.outputs.app_image }}
      SHOULD_PUSH: ${{ needs.meta.outputs.should_push }}
      HAS_DOCKER_CONFIG: ${{ needs.meta.outputs.has_docker_config }}
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 缺少凭据时必须明确失败，而不是静默跳过发布
      - name: 发布前置校验（凭据）
        if: needs.meta.outputs.should_push == 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || vars.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${DOCKER_USERNAME}" ]; then
            echo "::error title=缺少 DOCKER_USERNAME::请在 Repository secrets 配置 DOCKER_USERNAME（或 Repository variables 配置 DOCKER_USERNAME）"
            missing=1
          fi
          if [ -z "${DOCKER_TOKEN}" ]; then
            echo "::error title=缺少 DOCKER_TOKEN::请在 Repository secrets 配置 DOCKER_TOKEN（Docker Hub Access Token，注意不要使用登录密码）"
            missing=1
          fi
          if [ "${HAS_DOCKER_CONFIG}" != "true" ]; then
            echo "::error title=缺少 DOCKER_REPOSITORY::如需自定义镜像仓库，请在 Repository variables 配置 DOCKER_REPOSITORY，例如 liaozhiming/zaima（未配置时默认 <owner>/zaima）"
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          echo "凭据校验通过，镜像仓库：${IMAGE}"

      # 正式版本默认不可变：已存在的版本标签禁止覆盖
      - name: 正式版本不可变校验
        if: needs.meta.outputs.should_push == 'true' && needs.meta.outputs.is_release == 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || vars.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}
          VERSION: ${{ needs.meta.outputs.version }}
          FORCE: ${{ inputs.force_tag }}
        run: |
          set -euo pipefail
          if [ "${FORCE}" = "true" ]; then
            echo "::warning title=允许覆盖版本标签::force_tag=true，将覆盖 ${IMAGE}:${VERSION}"
            exit 0
          fi
          echo "${DOCKER_TOKEN}" | docker login "${REGISTRY}" -u "${DOCKER_USERNAME}" --password-stdin
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" > /dev/null 2>&1; then
            echo "::error title=版本标签已存在::${IMAGE}:${VERSION} 已存在，正式版本不可覆盖。如确需重发，请手动触发并勾选 force_tag。"
            exit 1
          fi
          echo "标签 ${VERSION} 未被占用，可以发布"

      # 登录镜像仓库（仅在需要推送时）
      - name: 登录 Docker Hub
        if: needs.meta.outputs.should_push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME || vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}

      # -------------------------------------------------------------------
      # 复用检测（关键优化）：如果同一 commit 的 sha-<full> 镜像已经存在
      # （通常由 main 推送时构建并推送过），就不再重复构建，而是直接用
      # `docker buildx imagetools create` 把它重打成本次的版本 / latest 标签。
      # 命中则跳过下面的构建步骤；未命中才回退为真正构建。
      # -------------------------------------------------------------------
      - name: 复用检测（已构建则仅重打标签）
        id: reuse
        if: needs.meta.outputs.should_push == 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || vars.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}
          TAGS: ${{ needs.meta.outputs.tags }}
          APP_TAGS: ${{ needs.meta.outputs.app_tags }}
          FULL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 探测需要只读登录（imagetools inspect 需要凭据）
          echo "${DOCKER_TOKEN}" | docker login "${REGISTRY}" -u "${DOCKER_USERNAME}" --password-stdin >/dev/null

          api_src="${IMAGE}:sha-${FULL_SHA}"
          app_src="${APP_IMAGE}:app-sha-${FULL_SHA}"

          # 把 $1 指向的已存在镜像重打成 $2 里列出的所有标签（排除源自身）
          retag() {
            local src="$1" list="$2" args=()
            while IFS= read -r t; do
              [ -z "${t}" ] && continue
              [ "${t}" = "${src}" ] && continue
              args+=(--tag "${t}")
            done <<< "${list}"
            if [ ${#args[@]} -gt 0 ]; then
              echo "重打标签：${src} -> ${list//$'\n'/ }"
              docker buildx imagetools create "${args[@]}" "${src}"
            fi
          }

          api_reused=false
          if docker buildx imagetools inspect "${api_src}" >/dev/null 2>&1; then
            api_reused=true
            retag "${api_src}" "${TAGS}"
          fi

          app_reused=false
          if docker buildx imagetools inspect "${app_src}" >/dev/null 2>&1; then
            app_reused=true
            retag "${app_src}" "${APP_TAGS}"
          fi

          echo "api_reused=${api_reused}" >> "$GITHUB_OUTPUT"
          echo "app_reused=${app_reused}" >> "$GITHUB_OUTPUT"

          {
            echo "### 镜像复用检测"
            echo ""
            echo "| 镜像 | 源标签 | 命中（已构建） |"
            echo "| --- | --- | --- |"
            echo "| API | \`sha-${FULL_SHA}\` | ${api_reused} |"
            echo "| 一体化 | \`app-sha-${FULL_SHA}\` | ${app_reused} |"
            echo ""
            echo "> 命中则跳过构建，仅重打版本标签（更快、更省资源）。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 构建并推送后端 API 镜像（复用命中时跳过）
      - name: 构建并推送镜像
        id: build
        if: steps.reuse.outputs.api_reused != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ needs.meta.outputs.should_push == 'true' }}
          tags: ${{ needs.meta.outputs.tags != '' && needs.meta.outputs.tags || format('{0}:{1}', needs.meta.outputs.image, needs.meta.outputs.version) }}
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.version }}
            APP_BUILD=${{ needs.meta.outputs.short_sha }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=zaima-api
          cache-to: type=gha,scope=zaima-api,mode=max
          provenance: true
          sbom: true

      # 一体化调试镜像：API + H5 同源，容器启动即可在浏览器打开页面（复用命中时跳过）
      - name: 构建并推送一体化镜像（API + H5）
        id: build_app
        if: steps.reuse.outputs.app_reused != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.app
          push: ${{ needs.meta.outputs.should_push == 'true' }}
          tags: ${{ needs.meta.outputs.app_tags != '' && needs.meta.outputs.app_tags || format('{0}:app-{1}', needs.meta.outputs.app_image, needs.meta.outputs.version) }}
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.version }}
            APP_BUILD=${{ needs.meta.outputs.short_sha }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=zaima-app
          cache-to: type=gha,scope=zaima-app,mode=max
          provenance: true
          sbom: true

      - name: 一体化镜像冒烟（启动后首页与接口均可访问）
        env:
          APP_TAGS: ${{ needs.meta.outputs.app_tags }}
          LOCAL_TAG: zaima-app:smoke
        run: |
          set -euo pipefail
          # 未推送时用本地构建的名字跑冒烟；推送时用刚推上去的 tag
          if [ -n "${APP_TAGS}" ]; then
            REF=$(printf '%s\n' "${APP_TAGS}" | head -1)
            docker pull "${REF}"
          else
            REF="${LOCAL_TAG}"
            docker build -f Dockerfile.app --build-arg APP_VERSION=smoke -t "${REF}" .
          fi
          # 测试镜像必须带前端产物
          docker run --rm --entrypoint sh "${REF}" -c 'test -f /app/static/index.html' \
            || { echo "::error::测试镜像缺少 /app/static/index.html"; exit 1; }
          docker run -d --name zaima-app-smoke -p 18080:8000 "${REF}"
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/api/health > /tmp/health.json 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          test "${ok}" = "1" || { echo "::error::一体化镜像启动失败"; docker logs zaima-app-smoke; exit 1; }
          curl -fsS http://127.0.0.1:18080/ -o /tmp/index.html
          grep -qi "<div id=\"app\"" /tmp/index.html || { echo "::error::首页未返回 H5 入口"; exit 1; }
          curl -fsS http://127.0.0.1:18080/api/health | tee /tmp/health.json
          echo "首页与 /api/health 均可访问"
          docker logs zaima-app-smoke 2>&1 | tail -20 || true

      # 推完后回头验证：生产镜像里绝不能有前端产物
      - name: 校验生产镜像不含前端
        if: needs.meta.outputs.should_push == 'true'
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          set -euo pipefail
          REF=$(printf '%s\n' "${TAGS}" | head -1)
          docker pull "${REF}"
          docker run --rm --entrypoint sh "${REF}" -c '
            test ! -d /app/static || { echo "::error::生产镜像不应包含 /app/static"; exit 1; }
            n=$(find / -name "index.html" -not -path "*/site-packages/*" 2>/dev/null | wc -l)
            test "$n" -eq 0 || { echo "::error::生产镜像内发现 index.html"; exit 1; }
          '
          echo "✓ 生产镜像 ${REF} 不含任何前端文件"

      - name: 输出镜像信息与 Digest
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          APP_DIGEST: ${{ steps.build_app.outputs.digest }}
          TAGS: ${{ needs.meta.outputs.tags }}
          APP_TAGS: ${{ needs.meta.outputs.app_tags }}
        run: |
          set -euo pipefail
          {
            echo "### 镜像"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 镜像 | \`${IMAGE}\` |"
            echo "| 版本标签 | \`${VERSION}\` |"
            echo "| 标签列表 | \`$(echo "${TAGS}" | tr '\n' ' ')\` |"
            echo "| Digest | \`${DIGEST:-未推送}\` |"
            echo "| 是否推送 | \`${SHOULD_PUSH}\` |"
            echo ""
            echo "部署时可固定 Digest：\`${IMAGE}@${DIGEST:-<digest>}\`"
            echo ""
            echo "### 一体化调试镜像"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 标签列表 | \`$(echo "${APP_TAGS}" | tr '\n' ' ')\` |"
            echo "| Digest | \`${APP_DIGEST:-未推送}\` |"
            echo ""
            echo "启动后直接访问 \`http://<host>:8000/\` 即可看到 H5；默认 \`APP_ENV=dev\` + SQLite + 模拟邮件，仅用于排查/演示。"
          } >> "$GITHUB_STEP_SUMMARY"

          mkdir -p release-manifest
          cat > release-manifest/image.json <<EOF
          {
            "event": "${GITHUB_EVENT_NAME}",
            "ref": "${GITHUB_REF}",
            "commit": "${GITHUB_SHA}",
            "version": "${VERSION}",
            "image": "${IMAGE}",
            "tags": $(echo "${TAGS}" | python3 -c 'import sys,json;print(json.dumps([l for l in sys.stdin.read().splitlines() if l.strip()]))'),
            "digest": "${DIGEST:-}",
            "appTags": $(echo "${APP_TAGS}" | python3 -c 'import sys,json;print(json.dumps([l for l in sys.stdin.read().splitlines() if l.strip()]))'),
            "appDigest": "${APP_DIGEST:-}",
            "pushed": ${SHOULD_PUSH}
          }
          EOF
          cat release-manifest/image.json

      - name: 上传发布清单
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-manifest-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.short_sha }}
          path: release-manifest/image.json
          retention-days: 90
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 6. GitHub Release（仅正式 Tag，且镜像推送成功后）
  # ------------------------------------------------------------------
  github-release:
    name: 创建 GitHub Release
    needs: [meta, docker]
    if: needs.meta.outputs.is_release == 'true' && needs.meta.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE: ${{ needs.meta.outputs.image }}
      IS_PRERELEASE: ${{ needs.meta.outputs.is_prerelease }}
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 创建 Release（已存在则跳过）
        run: |
          set -euo pipefail
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "::notice title=Release 已存在::${TAG} 已发布，保持不可变，跳过创建"
            exit 0
          fi
          NOTES="镜像：\`${IMAGE}:${VERSION}\`

          本版本由 GitHub Actions 自动构建，镜像标签与 Git Tag 一一对应。
          部署时建议使用 Digest 固定版本。"
          PRERELEASE_FLAG=""
          if [ "${IS_PRERELEASE}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
            NOTES="${NOTES}

          > 注意：这是预发布版本（alpha/beta/rc），仅供测试，请勿用于生产环境。"
          fi
          # shellcheck disable=SC2086
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            ${PRERELEASE_FLAG} \
            --notes "${NOTES}" \
            --verify-tag

  # ------------------------------------------------------------------
  # 7. 发布报告：把本次运行的关键信息汇总到 Actions 页面
  # ------------------------------------------------------------------
  report:
    name: 发布报告
    needs: [meta, backend-tests, frontend-checks, frontend-artifacts, h5-images, docker, github-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 写入发布摘要
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SHORT_SHA: ${{ needs.meta.outputs.short_sha }}
          IMAGE_NAME: ${{ needs.meta.outputs.image }}
          SHOULD_PUSH: ${{ needs.meta.outputs.should_push }}
          IS_RELEASE: ${{ needs.meta.outputs.is_release }}
          R_META: ${{ needs.meta.result }}
          R_BACKEND: ${{ needs.backend-tests.result }}
          R_FRONTEND: ${{ needs.frontend-checks.result }}
          R_ARTIFACTS: ${{ needs.frontend-artifacts.result }}
          R_H5: ${{ needs.h5-images.result }}
          R_DOCKER: ${{ needs.docker.result }}
          R_RELEASE: ${{ needs.github-release.result }}
        run: |
          set -euo pipefail
          {
            echo "## 在吗 · 发布报告"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 触发事件 | \`${GITHUB_EVENT_NAME}\` |"
            echo "| 分支 / Tag | \`${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}\` |"
            echo "| 完整提交 SHA | \`${GITHUB_SHA}\` |"
            echo "| 版本 | \`${VERSION}\` |"
            echo "| 正式发布 | \`${IS_RELEASE}\` |"
            echo ""
            echo "### 检查结果"
            echo ""
            echo "| 阶段 | 结果 |"
            echo "| --- | --- |"
            echo "| 版本计算 | ${R_META} |"
            echo "| 后端测试 | ${R_BACKEND} |"
            echo "| 前端检查 | ${R_FRONTEND} |"
            echo "| 前端产物 | ${R_ARTIFACTS} |"
            echo "| H5 镜像（nginx/scratch） | ${R_H5} |"
            echo "| 后端/一体化镜像 | ${R_DOCKER} |"
            echo "| GitHub Release | ${R_RELEASE} |"
            echo ""
            echo "### 产物"
            echo ""
            echo "| 类型 | 名称 |"
            echo "| --- | --- |"
            echo "| Artifact | \`zaima-frontend-h5-${VERSION}-${SHORT_SHA}\` |"
            echo "| Artifact | \`zaima-frontend-mp-weixin-${VERSION}-${SHORT_SHA}\` |"
            echo "| Artifact | \`zaima-frontend-mp-alipay-${VERSION}-${SHORT_SHA}\` |"
            echo "| Artifact | \`image-manifest-${VERSION}-${SHORT_SHA}\` |"
            echo "| 镜像 | \`${IMAGE_NAME}:${VERSION}\` / \`${IMAGE_NAME}:app-${VERSION}\` / \`${IMAGE_NAME}:h5-${VERSION}\`（是否推送：\`${SHOULD_PUSH}\`） |"
            echo ""
            echo "> 详细镜像标签与 Digest 见上一步「镜像构建与发布」的摘要。"
            echo "> 只有全部阶段为 \`success\`（跳过项显示 \`skipped\`）时，本次发布才算完成。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 判定整体结果
        run: |
          set -euo pipefail
          failed=""
          for entry in \
            "版本计算:${{ needs.meta.result }}" \
            "后端测试:${{ needs.backend-tests.result }}" \
            "前端检查:${{ needs.frontend-checks.result }}" \
            "前端产物:${{ needs.frontend-artifacts.result }}" \
            "镜像:${{ needs.docker.result }}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              failed="${failed} ${name}"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "::error title=发布未完成::失败阶段:${failed}"
            exit 1
          fi
          echo "全部阶段成功"
