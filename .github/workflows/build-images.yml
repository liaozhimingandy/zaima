name: Build Images

# =============================================================================
# 通用镜像构建工作流（可直接拷贝到其它项目复用）
#
# 职责：镜像构建/推送 与 测试/产物/Release 解耦，作为公共层被其它项目直接拉取。
# 按触发来源算出版本号，构建 4 类镜像：
#   后端 API / 一体化(app-) / H5 可运行 nginx(h5-) / H5 纯产物 scratch(h5-assets-)
#
# 触发与版本映射（版本号遵循 Django 发布模型）：
#   main 推送              → 开发构建 dev（仅 dev/latest，不附加 sha，防堆积）
#   stable/A.B.x 分支推送   → 系列补丁构建，版本=A.B，滚动 zaima:A.B / zaima:A
#   v* Tag（vA.B / vA.B.C） → 正式发布；vA.B.C 同时滚动 zaima:A.B / zaima:A
#   v*A(a|b|rc)N / v*A.B-(a|b|rc)N → 预发布(alpha/beta/rc)，不占 latest
#   手动 dispatch          → 可覆盖版本号；留空打 dev，填 A.B 打稳定系列镜像
#
# 复用需改（详见下方 on.push.paths / env 注释）：
#   1) env.DEFAULT_IMAGE_NAME 或 Variables.DOCKER_REPOSITORY（镜像名）
#   2) on.push.paths、env.NODE_VERSION、各 Dockerfile 路径（目录结构）
#   3) 各作业的 GHA 缓存作用域 scope=...（含项目 slug，需一并替换）
#   4) 凭据 Secrets：DOCKER_USERNAME + (DOCKER_TOKEN 或 DOCKER_PASSWORD)
#   5) 可选阿里云 ACR：ALIYUN_REGISTRY / ALIYUN_USERNAME / ALIYUN_PASSWORD + ALIYUN_NAMESPACE
# =============================================================================

on:
  push:
    branches: [main, 'stable/**']   # stable/A.B.x 系列分支：打该系列补丁镜像
    tags: ['v*']                    # vA.B / vA.B.C / vA.B(a|b|rc)N
    # 路径过滤（tag 推送不受 paths 影响）。其它项目按需调整目录：
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'Dockerfile.app'
      - 'Dockerfile.nginx'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '覆盖版本号（留空打 dev；填 A.B 打稳定系列镜像；tag 推送用 tag 名）'
        required: false
        type: string
      push:
        description: '是否推送到镜像仓库'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'            # 复用其它项目时按自身 Node 版本调整
  REGISTRY: docker.io
  DEFAULT_IMAGE_NAME: zaima     # 默认镜像名（owner/zaima）；或设置 Variables.DOCKER_REPOSITORY 覆盖
  ENABLE_FLOATING_TAGS: 'true'  # 正式发布/稳定分支是否滚动 A.B、A 浮动标签（Django 风格）

jobs:
  # ---------------------------------------------------------------------------
  # 1) 计算版本 / 标签（含可选的阿里云 ACR 目标）
  # ---------------------------------------------------------------------------
  meta:
    name: 计算版本与镜像标签
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.calc.outputs.version }}
      short_sha: ${{ steps.calc.outputs.short_sha }}
      image: ${{ steps.calc.outputs.image }}
      should_push: ${{ steps.calc.outputs.should_push }}
      aliyun_enabled: ${{ steps.calc.outputs.aliyun_enabled }}
      backend_tags: ${{ steps.calc.outputs.backend_tags }}
      app_tags: ${{ steps.calc.outputs.app_tags }}
      h5_tags: ${{ steps.calc.outputs.h5_tags }}
      h5_assets_tags: ${{ steps.calc.outputs.h5_assets_tags }}
    steps:
      - name: 计算
        id: calc
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUSH: ${{ inputs.push }}
          DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}
          ENABLE_FLOATING_TAGS: ${{ vars.ENABLE_FLOATING_TAGS }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE || 'zaima' }}
        run: |
          set -euo pipefail
          FULL_SHA="${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA::7}"
          # Django 风格版本号：vA.B / vA.B.C / vA.B(a|b|rc)N，预发布同时支持 v1.0rc1 与 v1.0-rc1 两种写法
          SEMVER_RE='^v[0-9]+\.[0-9]+(\.[0-9]+)?(-?(a|b|rc)[0-9]+)?$'
          # 稳定分支：stable/A.B.x 或 stable/A.B
          SERIES_RE='^stable/([0-9]+\.[0-9]+)(\.x)?$'

          VERSION=""
          SHOULD_PUSH="false"
          IS_RELEASE="false"
          IS_PRERELEASE="false"
          IS_DEV="false"
          IS_STABLE="false"      # 是否稳定系列构建（stable 分支或手动指定 A.B）
          SERIES=""              # 系列号 A.B（用于浮动标签）
          LATEST="false"
          FLOATING="${ENABLE_FLOATING_TAGS:-true}"

          if [ "${EVENT_NAME}" = "push" ] && [ "${REF_TYPE}" = "tag" ]; then
            if ! [[ "${REF_NAME}" =~ ${SEMVER_RE} ]]; then
              echo "::error::Tag ${REF_NAME} 不符合规范（vA.B / vA.B.C / vA.B(a|b|rc)N，预发布 v1.0-rc1）"
              exit 1
            fi
            VERSION="${REF_NAME#v}"
            SHOULD_PUSH="true"
            IS_RELEASE="true"
            if [[ "${VERSION}" =~ (a|b|rc)[0-9]+$ ]]; then IS_PRERELEASE="true"; fi
            # 稳定（非预发布）发布滚动 A.B / A 浮动标签
            if [ "${IS_PRERELEASE}" != "true" ]; then
              LATEST="true"
              SERIES=$(echo "${VERSION}" | cut -d. -f1,2)
            fi
          elif [ "${EVENT_NAME}" = "push" ] && [ "${REF_TYPE}" = "branch" ]; then
            if [[ "${REF_NAME}" =~ ${SERIES_RE} ]]; then
              # stable/A.B.x：该系列补丁构建，版本=A.B，滚动 A.B / A（不占 latest）
              SERIES="${BASH_REMATCH[1]}"
              VERSION="${SERIES}"
              IS_STABLE="true"
              SHOULD_PUSH="true"
            elif [ "${REF_NAME}" = "main" ]; then
              # 开发构建：固定 dev，不附加 sha，避免每次提交产生新标签
              VERSION="dev"
              IS_DEV="true"
              SHOULD_PUSH="true"
              LATEST="true"
            else
              # 其它分支（feature 等）不构建镜像
              SHOULD_PUSH="false"
            fi
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION:-dev}"
            SHOULD_PUSH="${INPUT_PUSH:-true}"
            if [ "${SHOULD_PUSH}" = "true" ]; then LATEST="true"; fi
            if [ "${VERSION}" = "dev" ]; then IS_DEV="true"; fi
            # 手动指定 A.B 视为稳定系列构建（滚动 A.B / A）
            if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+$ ]]; then IS_STABLE="true"; SERIES="${VERSION}"; LATEST="false"; fi
          fi

          [ -n "${VERSION}" ] || { echo "::error::无法确定版本号"; exit 1; }

          IMAGE="${DOCKER_REPOSITORY:-${GITHUB_REPOSITORY_OWNER}/${DEFAULT_IMAGE_NAME}}"
          IMAGE_ALI=""
          if [ -n "${ALIYUN_REGISTRY:-}" ]; then
            IMAGE_ALI="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/$(basename "${IMAGE}")"
          fi

          # 生成某个前缀下的全部标签（Docker Hub + 可选阿里云）
          tag_lines() {
            local p="$1" out
            out="${IMAGE}:${p}${VERSION}"
            # 仅非 dev 构建附加 per-commit 的 sha 标签（dev 不附加，避免堆积）
            if [ "${IS_DEV}" != "true" ]; then
              out="${out}"$'\n'"${IMAGE}:${p}sha-${SHORT_SHA}"
            fi
            if [ "${LATEST}" = "true" ]; then out="${out}"$'\n'"${IMAGE}:${p}latest"; fi
            # 浮动系列标签（Django 风格）：让 zaima:A.B / zaima:A 始终指向该系列最新（仅稳定发布/分支）
            if [ "${FLOATING}" = "true" ] && [ -n "${SERIES}" ]; then
              out="${out}"$'\n'"${IMAGE}:${p}${SERIES}"
              out="${out}"$'\n'"${IMAGE}:${p}$(echo "${SERIES}" | cut -d. -f1)"
            fi
            if [ -n "${IMAGE_ALI}" ]; then
              out="${out}"$'\n'"${IMAGE_ALI}:${p}${VERSION}"
              if [ "${IS_DEV}" != "true" ]; then
                out="${out}"$'\n'"${IMAGE_ALI}:${p}sha-${SHORT_SHA}"
              fi
              if [ "${LATEST}" = "true" ]; then out="${out}"$'\n'"${IMAGE_ALI}:${p}latest"; fi
              if [ "${FLOATING}" = "true" ] && [ -n "${SERIES}" ]; then
                out="${out}"$'\n'"${IMAGE_ALI}:${p}${SERIES}"
                out="${out}"$'\n'"${IMAGE_ALI}:${p}$(echo "${SERIES}" | cut -d. -f1)"
              fi
            fi
            printf '%s\n' "${out}" | awk 'NF && !seen[$0]++'
          }

          emit() {
            local key="$1" p="$2"
            echo "${key}<<${key}_EOF"
            tag_lines "${p}"
            echo "${key}_EOF"
          }

          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "image=${IMAGE}"
            echo "should_push=${SHOULD_PUSH}"
            echo "aliyun_enabled=$([ -n "${IMAGE_ALI}" ] && echo true || echo false)"
            emit backend_tags ""
            emit app_tags "app-"
            emit h5_tags "h5-"
            emit h5_assets_tags "h5-assets-"
          } >> "$GITHUB_OUTPUT"

          {
            RTYPE="开发(dev)"
            [ "${IS_STABLE}" = "true" ] && RTYPE="稳定系列(${SERIES})"
            [ "${IS_RELEASE}" = "true" ] && RTYPE="正式发布"
            [ "${IS_PRERELEASE}" = "true" ] && RTYPE="预发布"
            echo "### 镜像构建计划"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 事件 | \`${EVENT_NAME}\` |"
            echo "| 引用 | \`${REF_TYPE}:${REF_NAME}\` |"
            echo "| 版本 | \`${VERSION}\` |"
            echo "| 系列 | \`${SERIES:-—}\` |"
            echo "| 类型 | \`${RTYPE}\` |"
            echo "| 镜像仓库 | \`${IMAGE}\` |"
            if [ -n "${IMAGE_ALI}" ]; then
              echo "| 阿里云 ACR | ${IMAGE_ALI} |"
            else
              echo "| 阿里云 ACR | 未配置 |"
            fi
            echo "| 是否推送 | \`${SHOULD_PUSH}\` |"
            echo ""
            echo '```'
            tag_lines ""
            tag_lines "app-"
            tag_lines "h5-"
            tag_lines "h5-assets-"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2) 后端 API 镜像
  # ---------------------------------------------------------------------------
  backend-image:
    name: 后端 API 镜像
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: needs.meta.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # 支持两种登录方式：DOCKER_TOKEN（PAT，推荐）或 DOCKER_PASSWORD（用户名 + 密码）
          username: ${{ secrets.DOCKER_USERNAME || vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD || vars.DOCKER_PASSWORD }}

      - name: 登录阿里云 ACR
        if: needs.meta.outputs.should_push == 'true' && needs.meta.outputs.aliyun_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME || vars.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD || vars.ALIYUN_PASSWORD }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ needs.meta.outputs.should_push == 'true' }}
          tags: ${{ needs.meta.outputs.backend_tags }}
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.version }}
            APP_BUILD=${{ needs.meta.outputs.short_sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=zaima-api
          cache-to: type=gha,scope=zaima-api,mode=max
          provenance: false
          sbom: false

  # ---------------------------------------------------------------------------
  # 3) 一体化调试镜像（API + H5）
  # ---------------------------------------------------------------------------
  app-image:
    name: 一体化镜像（API + H5）
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: needs.meta.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # 支持两种登录方式：DOCKER_TOKEN（PAT，推荐）或 DOCKER_PASSWORD（用户名 + 密码）
          username: ${{ secrets.DOCKER_USERNAME || vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD || vars.DOCKER_PASSWORD }}

      - name: 登录阿里云 ACR
        if: needs.meta.outputs.should_push == 'true' && needs.meta.outputs.aliyun_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME || vars.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD || vars.ALIYUN_PASSWORD }}

      - name: 构建并推送一体化镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.app
          push: ${{ needs.meta.outputs.should_push == 'true' }}
          tags: ${{ needs.meta.outputs.app_tags }}
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.version }}
            APP_BUILD=${{ needs.meta.outputs.short_sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=zaima-app
          cache-to: type=gha,scope=zaima-app,mode=max
          provenance: false
          sbom: false

  # ---------------------------------------------------------------------------
  # 4) H5 镜像（nginx 可运行 + scratch 纯产物）
  # ---------------------------------------------------------------------------
  h5-images:
    name: H5 镜像（nginx / scratch）
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 构建 H5
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ needs.meta.outputs.version }}
          VITE_APP_BUILD: ${{ needs.meta.outputs.short_sha }}
        run: npm run build:h5

      - name: 准备 h5-dist
        run: |
          set -euo pipefail
          rm -rf h5-dist && mkdir -p h5-dist
          cp -r frontend/dist/build/h5/. h5-dist/
          test -f h5-dist/index.html

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: needs.meta.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # 支持两种登录方式：DOCKER_TOKEN（PAT，推荐）或 DOCKER_PASSWORD（用户名 + 密码）
          username: ${{ secrets.DOCKER_USERNAME || vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD || vars.DOCKER_PASSWORD }}

      - name: 登录阿里云 ACR
        if: needs.meta.outputs.should_push == 'true' && needs.meta.outputs.aliyun_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME || vars.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD || vars.ALIYUN_PASSWORD }}

      - name: 构建并推送 H5 nginx 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.nginx
          push: ${{ needs.meta.outputs.should_push == 'true' }}
          tags: ${{ needs.meta.outputs.h5_tags }}
          cache-from: type=gha,scope=zaima-h5
          cache-to: type=gha,scope=zaima-h5,mode=max
          provenance: false
          sbom: false

      - name: 构建并推送 H5 纯产物镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ needs.meta.outputs.should_push == 'true' }}
          tags: ${{ needs.meta.outputs.h5_assets_tags }}
          cache-from: type=gha,scope=zaima-h5-assets
          cache-to: type=gha,scope=zaima-h5-assets,mode=max
          provenance: false
          sbom: false

      - name: H5 nginx 镜像冒烟
        if: needs.meta.outputs.should_push == 'true'
        run: |
          set -euo pipefail
          REF=$(printf '%s\n' "${{ needs.meta.outputs.h5_tags }}" | head -1)
          docker pull "${REF}"
          docker run -d --name h5-smoke -p 18080:80 "${REF}"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ -o /tmp/index.html 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "${ok}" = "1" || { echo "::error::H5 nginx 镜像启动失败"; docker logs h5-smoke; exit 1; }
          grep -qi '<div id="app"' /tmp/index.html || { echo "::error::首页未返回 H5 入口"; cat /tmp/index.html; exit 1; }
          echo "H5 nginx 镜像冒烟通过"
          docker rm -f h5-smoke
