# =============================================================================
# ci.yml  -- 公共 CI 模板（任意工程 drop-in）
# 触发: push 到 main/develop / 任意 PR
# 作用: 自动探测前后端目录（根或子目录），分别执行 lint/test；无对应语言则跳过
# 用户自定义步骤: 在 .ci/hooks/ci.sh 放入项目专属检查（详见 .ci/hooks/README.md）
# =============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.14' }}
  NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 自动定位前端/后端目录（支持 frontend/ backend/ server/ 等子目录）
      - name: Detect project dirs
        id: fe
        run: |
          if [ -f .ci/scripts/detect-frontend.sh ]; then
            bash .ci/scripts/detect-frontend.sh >> "$GITHUB_OUTPUT"
          else
            {
              echo "frontend_dir=."; echo "frontend_lock="; echo "frontend_pm=npm"
              echo "frontend_has_build=false"; echo "frontend_build_cmd="
              echo "has_frontend=$([ -f package.json ] && echo true || echo false)"
              echo "backend_dir=."
              echo "has_backend=$([ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ] && echo true || echo false)"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Backend (Python) setup + lint + test
        if: ${{ steps.fe.outputs.has_backend == 'true' }}
        working-directory: ${{ steps.fe.outputs.backend_dir }}
        run: |
          command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          if [ -f uv.lock ]; then uv sync --no-dev || uv sync; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          uv run ruff check . 2>/dev/null || true
          if [ -f uv.lock ]; then uv run pytest -q; else pytest -q 2>/dev/null || true; fi

      - name: Frontend (Node) setup
        if: ${{ steps.fe.outputs.has_frontend == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.fe.outputs.frontend_lock != '' && steps.fe.outputs.frontend_pm || '' }}
          cache-dependency-path: ${{ steps.fe.outputs.frontend_lock }}
      - name: Frontend install + lint + test
        if: ${{ steps.fe.outputs.has_frontend == 'true' }}
        working-directory: ${{ steps.fe.outputs.frontend_dir }}
        run: |
          if [ -z "${{ steps.fe.outputs.frontend_lock }}" ]; then npm install
          elif [ "${{ steps.fe.outputs.frontend_pm }}" = "pnpm" ]; then corepack enable; pnpm install --frozen-lockfile
          elif [ "${{ steps.fe.outputs.frontend_pm }}" = "yarn" ]; then yarn install --frozen-lockfile
          else npm ci; fi
          npm run lint --if-present
          npm test --if-present

      - name: Custom CI hook (.ci/hooks/ci.sh)
        if: ${{ hashFiles('.ci/hooks/ci.sh') != '' }}
        run: bash .ci/hooks/ci.sh
